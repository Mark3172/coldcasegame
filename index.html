        revealedMessage: `Handshake verified. Transporting packet: ${crime.redactionDecrypted}. Decrypted message: "${crime.decryptedChatPayload}"`,
        status: "HIGH_RISK",
        details: `CONTRADICTION: Encrypted socket opened by ${culprit.name} at ${crime.incidentTime}:32 communicating with external buyer while claiming to be reading offline documents!`,
        contradiction: `Encrypted Relay Chat coordinating transfer at ${crime.incidentTime}:32`,
        isRedacted: true,
        deepScanned: false,
        isCulpritContradiction: true
      });

      chatLogs.push({
        id: `chat_innocent_02`,
        timestamp: `22:38:19`,
        sender: suspects[innocentIndices[0]].name,
        channel: "#secops-audit",
        message: "Routine daily token rotation complete. All Level-4 credentials verified.",
        status: "ROUTINE",
        details: "Standard SecOps administrative maintenance.",
        contradiction: null,
        deepScanned: false
      });

      // 3. NETWORK LOGS (Telemetry & Transfers)
      networkLogs.push({
        id: `net_routine_01`,
        timestamp: `21:38:50`,
        source: "10.0.8.21 (Prometheus-Monitor)",
        destination: "10.0.8.254 (Gateway-Prod)",
        protocol: "HTTP-METRICS :9090",
        volume: "48 KB",
        status: "CLEAN",
        details: "Routine monitoring scrape.",
        contradiction: null,
        deepScanned: false
      });

      // Culprit Network Telemetry (CONTRADICTION 2B)
      networkLogs.push({
        id: `net_culprit_contradiction`,
        timestamp: `${crime.incidentTime}:22`,
        source: `10.14.88.42 (${culprit.name}'s Static Docking IP)`,
        destination: "185.220.101.5 (Tor Bulletproof Relay)",
        protocol: crime.suspiciousProtocol,
        volume: "4.2 GB",
        status: "CRITICAL_THREAT",
        details: `CONTRADICTION: High-bandwidth transmission authenticated with ${culprit.name}'s biometric RSA token directly during the incident window!`,
        contradiction: `Anomalous ${crime.suspiciousProtocol} transmission authenticated by ${culprit.name}'s hardware token at ${crime.incidentTime}:22`,
        deepScanned: false,
        isCulpritContradiction: true
      });

      networkLogs.push({
        id: `net_routine_02`,
        timestamp: `22:04:11`,
        source: "10.0.12.8 (Auth-Service-Pod)",
        destination: "10.0.12.1 (Redis-Session-Cluster)",
        protocol: "TCP :6379",
        volume: "12 KB",
        status: "CLEAN",
        details: "Normal session keepalive telemetry.",
        contradiction: null,
        deepScanned: false
      });

      return {
        caseNumber,
        caseId: `CASE-${1040 + caseNumber * 9}-${crime.typeId.split("_")[1]}`,
        crime,
        suspects,
        culpritId: culprit.id,
        culpritName: culprit.name,
        evidence: {
          badgeLogs: badgeLogs.sort((a, b) => a.timestamp.localeCompare(b.timestamp)),
          chatLogs: chatLogs.sort((a, b) => a.timestamp.localeCompare(b.timestamp)),
          networkLogs: networkLogs.sort((a, b) => a.timestamp.localeCompare(b.timestamp))
        }
      };
    }

    // ==========================================
    // 4. MAIN APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Game State
      const [caseData, setCaseData] = useState(null);
      const [ap, setAp] = useState(8);
      const [maxAp, setMaxAp] = useState(8);
      const [activeTab, setActiveTab] = useState('badge'); // badge, chat, network, notes
      const [pinnedLogIds, setPinnedLogIds] = useState([]);
      const [playerNotes, setPlayerNotes] = useState('');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterFlaggedOnly, setFilterFlaggedOnly] = useState(false);

      // Selected / expanded items
      const [selectedSuspectId, setSelectedSuspectId] = useState(null);
      const [expandedLogId, setExpandedLogId] = useState(null);

      // Gadgets active modals
      const [activeGadgetModal, setActiveGadgetModal] = useState(null); // 'tracker', 'voice', 'decrypt', null
      const [trackerResult, setTrackerResult] = useState(null);
      const [interrogatingSuspect, setInterrogatingSuspect] = useState(null);
      const [interrogationDialogue, setInterrogationDialogue] = useState(null);
      const [decryptingLog, setDecryptingLog] = useState(null);
      const [decryptStep, setDecryptStep] = useState(0);

      // Surprise Intercept (Live Leak) State
      const [liveLeakModal, setLiveLeakModal] = useState(null); // { type, title, text, actionText, onAction }
      const [apSpentCounter, setApSpentCounter] = useState(0);
      const [leaksTriggeredCount, setLeaksTriggeredCount] = useState(0);
      const [shakeScreen, setShakeScreen] = useState(false);

      // Accusation & Verdict
      const [accusationModalOpen, setAccusationModalOpen] = useState(false);
      const [selectedAccusedSuspectId, setSelectedAccusedSuspectId] = useState('');
      const [selectedEvidence1, setSelectedEvidence1] = useState('');
      const [selectedEvidence2, setSelectedEvidence2] = useState('');
      const [verdictData, setVerdictData] = useState(null); // { isSuccess, title, text, details }
      const [verifyingStage, setVerifyingStage] = useState(0); // 0 = idle, 1..4 = animated steps

      // Career & Tech Lab
      const [career, setCareer] = useState({
        xp: 150,
        level: 1,
        rankTitle: "Junior Log Analyst",
        creds: 250,
        casesSolved: 0,
        streak: 0,
        upgrades: {
          extraApBattery: false,
          quantumDecryptor: false,
          forensicCache: false
        }
      });
      const [techLabOpen, setTechLabOpen] = useState(false);

      // Boss Mode & UI Meta
      const [bossMode, setBossMode] = useState(false);
      const [soundMuted, setSoundMuted] = useState(false);
      const [tutorialActive, setTutorialActive] = useState(false);
      const [tutorialStep, setTutorialStep] = useState(0);
      const [toastMsg, setToastMsg] = useState(null);

      // ==========================================
      // INITIALIZATION & LOCALSTORAGE
      // ==========================================
      useEffect(() => {
        // Load saved state if present
        const saved = localStorage.getItem('THE_COLD_FILE_STATE_V1');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setCaseData(parsed.caseData);
            setAp(parsed.ap !== undefined ? parsed.ap : 8);
            setMaxAp(parsed.maxAp || 8);
            setPinnedLogIds(parsed.pinnedLogIds || []);
            setPlayerNotes(parsed.playerNotes || '');
            setCareer(parsed.career || career);
            setSoundMuted(!!parsed.soundMuted);
            audio.muted = !!parsed.soundMuted;
          } catch (e) {
            startNewCase(1);
          }
        } else {
          startNewCase(1);
          // Launch tutorial on fresh load
          setTutorialActive(true);
        }

        // Global Boss Key listener (Escape key)
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setBossMode(prev => {
              const next = !prev;
              if (next) audio.beep();
              else audio.click();
              return next;
            });
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Auto-save whenever critical states update
      useEffect(() => {
        if (!caseData) return;
        const stateToSave = {
          caseData,
          ap,
          maxAp,
          pinnedLogIds,
          playerNotes,
          career,
          soundMuted
        };
        localStorage.setItem('THE_COLD_FILE_STATE_V1', JSON.stringify(stateToSave));
      }, [caseData, ap, maxAp, pinnedLogIds, playerNotes, career, soundMuted]);

      // Sound mute sync
      const toggleSound = () => {
        const next = !soundMuted;
        setSoundMuted(next);
        audio.muted = next;
        if (!next) audio.click();
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // ==========================================
      // SPEND AP & TRIGGER LIVE LEAKS
      // ==========================================
      const spendAP = (cost, actionName) => {
        if (ap < cost) {
          audio.alert();
          showToast(`⚠️ INSUFFICIENT COMPUTE AP! (${cost} required, ${ap} remaining)`);
          return false;
        }

        const newAp = ap - cost;
        setAp(newAp);
        audio.click();

        // Increment spend counter for plot twist mechanic
        const nextSpent = apSpentCounter + cost;
        setApSpentCounter(nextSpent);

        // Every 2-3 AP spent, trigger a LIVE LEAK twist!
        if (nextSpent >= 2 && leaksTriggeredCount < 3) {
          triggerLiveLeak(leaksTriggeredCount);
          setApSpentCounter(0);
          setLeaksTriggeredCount(prev => prev + 1);
        }

        if (newAp === 0) {
          showToast("⚠️ ALL ACTION POINTS EXHAUSTED! PROCEED TO ACCUSATION.");
        }

        return true;
      };

      // Plot Twist Engine
      const triggerLiveLeak = (index) => {
        setShakeScreen(true);
        audio.alert();
        setTimeout(() => setShakeScreen(false), 500);

        const leakTypes = [
          {
            type: 'COVER_UP',
            title: '⚠️ CRITICAL INTERCEPT // LOG PURGE IN PROGRESS',
            text: `Hostile shell script 'shred_vault_audit.sh' detected on Node 4! Someone is attempting to overwrite badge records for ${caseData.crime.incidentTime}. Spend 1 AP to intercept and salvage the raw buffer, or let it burn?`,
            actionText: 'INTERCEPT BUFFER (-1 AP)',
            onAction: () => {
              if (ap >= 1) {
                setAp(prev => prev - 1);
                // Mark culprit contradiction discovered
                showToast(`🚨 INTERCEPT SUCCESSFUL! Recovered smoking-gun keycard swipe to ${caseData.crime.restrictedRoom}!`);
                setLiveLeakModal(null);
                setActiveTab('badge');
                setExpandedLogId('badge_culprit_contradiction');
                audio.success();
              } else {
                showToast("⚠️ Not enough AP to intercept!");
              }
            }
          },
          {
            type: 'DRIVE_CRACKED',
            title: '🔓 FORENSIC DROP // SSD SECTOR DECRYPTED',
            text: `The offline forensics cluster just finished brute-forcing an encrypted backup image from the 4th floor workstation. Biometric timestamp verifies ${caseData.suspects.find(s => !s.isCulprit && !s.hasRedHerring)?.name} was in their claimed office during the incident!`,
            actionText: 'CONFIRM & MARK CLEARED (FREE)',
            onAction: () => {
              const innocent = caseData.suspects.find(s => !s.isCulprit && !s.hasRedHerring);
              if (innocent) {
                updateSuspectTag(innocent.id, 'CLEARED');
                showToast(`✅ ${innocent.name} officially verified and cleared!`);
              }
              setLiveLeakModal(null);
              audio.beep();
            }
          },
          {
            type: 'WHISTLEBLOWER',
            title: '📡 ENCRYPTED WHISTLEBLOWER TRANSMISSION',
            text: `Incoming PGP transmission from an anonymous internal relay: "I saw the intruder leaving the ${caseData.crime.restrictedRoom} corridor. The perpetrator held ${caseData.suspects.find(s => s.isCulprit)?.accessLevel} clearance!"`,
            actionText: 'RECORD IN CASE NOTES (FREE)',
            onAction: () => {
              const culprit = caseData.suspects.find(s => s.isCulprit);
              setPlayerNotes(prev => prev + `\n[WHISTLEBLOWER TIP]: Culprit confirmed to hold ${culprit?.accessLevel}!`);
              showToast("📝 Whistleblower intelligence appended to Case Notes.");
              setLiveLeakModal(null);
              audio.beep();
            }
          }
        ];

        const selectedLeak = leakTypes[index % leakTypes.length];
        setLiveLeakModal(selectedLeak);
      };

      // ==========================================
      // GAME ACTIONS
      // ==========================================
      const startNewCase = (caseNum) => {
        const fresh = generateCaseData(caseNum || (caseData ? caseData.caseNumber + 1 : 1));
        const initialMaxAp = career.upgrades.extraApBattery ? 10 : 8;
        setCaseData(fresh);
        setAp(initialMaxAp);
        setMaxAp(initialMaxAp);
        setPinnedLogIds([]);
        setPlayerNotes(`CASE FILE: ${fresh.caseId}\nCRIME: ${fresh.crime.title}\nINCIDENT WINDOW: ${fresh.crime.criticalWindow}\nASSET: ${fresh.crime.compromisedAsset}\n---\n`);
        setSelectedSuspectId(null);
        setExpandedLogId(null);
        setVerdictData(null);
        setAccusationModalOpen(false);
        setApSpentCounter(0);
        setLeaksTriggeredCount(0);
        audio.scan();
        showToast(`📁 ${fresh.caseId} LOADED // INCIDENT DEPLOYED`);
      };

      const updateSuspectTag = (suspectId, newTag) => {
        audio.click();
        setCaseData(prev => {
          const updated = { ...prev };
          updated.suspects = updated.suspects.map(s => s.id === suspectId ? { ...s, userTag: newTag } : s);
          return updated;
        });
      };

      // Deep Scan an evidence entry
      const handleDeepScan = (logId, streamType) => {
        // Free if forensicCache upgrade active and first scan
        let cost = 1;
        if (!spendAP(cost, "Deep Scan")) return;

        audio.scan();
        setCaseData(prev => {
          const updated = { ...prev };
          const logs = updated.evidence[streamType];
          const target = logs.find(l => l.id === logId);
          if (target) {
            target.deepScanned = true;
          }
          return updated;
        });
        setExpandedLogId(logId);
        showToast("🔍 FORENSIC DEEP SCAN COMPLETE");
      };

      // Pin / Unpin log to Notes Pinboard
      const togglePinLog = (logId) => {
        audio.click();
        setPinnedLogIds(prev => {
          if (prev.includes(logId)) {
            showToast("Unpinned from case notes");
            return prev.filter(id => id !== logId);
          } else {
            showToast("📌 Pinned to Case Notes Pinboard");
            return [...prev, logId];
          }
        });
      };

      // ==========================================
      // GADGET 1: SIGNAL TRACKER
      // ==========================================
      const launchSignalTracker = (suspect) => {
        if (!spendAP(1, "Signal Tracker")) return;
        audio.beep();
        setTrackerResult(null);
        setActiveGadgetModal('tracker');

        // Simulate radar sweep
        setTimeout(() => {
          audio.scan();
          const isMatch = suspect.actualRoom === suspect.statedRoom;
          setTrackerResult({
            suspect,
            statedRoom: suspect.statedRoom,
            actualRoom: suspect.actualRoom,
            isMatch,
            contradiction: !isMatch ? `Signal Tracker located ${suspect.name} in ${suspect.actualRoom} despite claiming ${suspect.statedRoom}` : null
          });
        }, 1200);
      };

      // ==========================================
      // GADGET 2: VOICE MODULATOR (INTERROGATE)
      // ==========================================
      const launchVoiceInterrogate = (suspect) => {
        audio.click();
        setInterrogatingSuspect(suspect);
        setInterrogationDialogue(null);
        setActiveGadgetModal('voice');
      };

      const executeInterrogationVector = (vectorType) => {
        if (!spendAP(1, "Voice Interrogation")) return;
        audio.voiceBeep(450);

        const s = interrogatingSuspect;
        let response = "";
        let stressInc = 15;

        if (s.isCulprit) {
          stressInc = 40;
          if (vectorType === 'ALIBI') {
            response = caseData.crime.alibiSlipDialogue;
          } else if (vectorType === 'MOTIVE') {
            response = `Look, my personal investments and debts are private business. That has nothing to do with what happened in ${caseData.crime.restrictedRoom}! Wait... I never said it was in that room...`;
          } else {
            response = `Your packet traces are completely falsified! My private RSA token is locked in my desk! I never authorized any ${caseData.crime.suspiciousProtocol} exfiltration!`;
          }
        } else if (s.hasRedHerring) {
          stressInc = 20;
          if (vectorType === 'ALIBI') {
            response = `I already told SecOps: I was replacing a fried UPS capacitor in the Sublevel 1 utility corridor. Check Facilities Ticket #FAC-8812! I wasn't anywhere near ${caseData.crime.restrictedRoom}.`;
          } else {
            response = `Yeah, I was furious about the executive bonus pool, but I'm an engineer, not a criminal. Look at my workstation logs—everything is clean.`;
          }
        } else {
          stressInc = 5;
          response = `I have nothing to hide. I was in ${s.statedRoom} collaborating on the sprint board. You can cross-check my commit history on GitHub—every timestamp matches.`;
        }

        // Voice chatter
        for (let i = 0; i < 4; i++) {
          setTimeout(() => audio.voiceBeep(350 + i * 50), i * 90);
        }

        setInterrogationDialogue({
          vector: vectorType,
          suspectName: s.name,
          text: response,
          stressLevel: Math.min(100, s.stressLevel + stressInc),
          revealedSlip: s.isCulprit
        });

        // Update suspect in state
        setCaseData(prev => {
          const updated = { ...prev };
          const target = updated.suspects.find(item => item.id === s.id);
          if (target) {
            target.stressLevel = Math.min(100, target.stressLevel + stressInc);
            target.interrogated = true;
          }
          return updated;
        });
      };

      // ==========================================
      // GADGET 3: PACKET DECRYPTOR
      // ==========================================
      const launchPacketDecryptor = (log) => {
        if (!spendAP(1, "Packet Decryptor")) return;
        setDecryptingLog(log);
        setDecryptStep(0);
        setActiveGadgetModal('decrypt');
        audio.decrypt();

        // Matrix reveal animation steps
        setTimeout(() => { audio.decrypt(); setDecryptStep(1); }, 600);
        setTimeout(() => { audio.decrypt(); setDecryptStep(2); }, 1200);
        setTimeout(() => {
          audio.success();
          setDecryptStep(3);
          // Mark in case data
          setCaseData(prev => {
            const updated = { ...prev };
            const foundChat = updated.evidence.chatLogs.find(l => l.id === log.id);
            if (foundChat) {
              foundChat.isRedacted = false;
              foundChat.message = foundChat.revealedMessage || foundChat.message;
            }
            return updated;
          });
          showToast("🔓 PAYLOAD CIPHER CRACKED & REVEALED!");
        }, 1800);
      };

      // ==========================================
      // ACCUSATION SHOWDOWN & VERDICT
      // ==========================================
      const handleExecuteIndictment = () => {
        if (!selectedAccusedSuspectId) {
          audio.alert();
          showToast("⚠️ PLEASE SELECT A SUSPECT TO ACCUSE!");
          return;
        }

        audio.scan();
        setVerifyingStage(1);

        setTimeout(() => { audio.beep(); setVerifyingStage(2); }, 900);
        setTimeout(() => { audio.scan(); setVerifyingStage(3); }, 1800);
        setTimeout(() => {
          setVerifyingStage(4);
          const accused = caseData.suspects.find(s => s.id === selectedAccusedSuspectId);
          const isCorrectCulprit = accused && accused.isCulprit;

          // Check evidence quality
          const hasLinkedEvidence = selectedEvidence1 || selectedEvidence2;

          if (isCorrectCulprit) {
            audio.success();
            const xpGained = 500;
            const credsGained = 350;
            const newStreak = career.streak + 1;
            const newTotalSolved = career.casesSolved + 1;
            const newXp = career.xp + xpGained;
            const newLevel = Math.floor(newXp / 400) + 1;

            const ranks = [
              "Junior Log Analyst",
              "Forensic Specialist II",
              "Senior Threat Hunter",
              "Incident Commander",
              "Chief Security Inquisitor"
            ];
            const rankTitle = ranks[Math.min(ranks.length - 1, newLevel - 1)];

            setCareer(prev => ({
              ...prev,
              xp: newXp,
              level: newLevel,
              rankTitle,
              creds: prev.creds + credsGained,
              streak: newStreak,
              casesSolved: newTotalSolved
            }));

            setVerdictData({
              isSuccess: true,
              accused,
              title: "CASE CLOSED // GUILTY VERDICT CONFIRMED",
              summary: `${accused.name} has been taken into corporate custody after biometric logs, network tokens, and cryptographic intercepts conclusively proved culpability.`,
              breakdown: [
                `Primary Contradiction: Stated presence in ${accused.statedRoom} directly falsified by Keycard & Signal Tracker logs placing them in ${caseData.crime.restrictedRoom}.`,
                `Digital Contradiction: Exfiltration of ${caseData.crime.compromisedAsset} routed through ${caseData.crime.suspiciousProtocol} signed with ${accused.name}'s biometric RSA token.`,
                `Motive: ${accused.motive}`
              ],
              xpGained,
              credsGained,
              streak: newStreak
            });
          } else {
            audio.failure();
            setCareer(prev => ({
              ...prev,
              streak: 0,
              xp: prev.xp + 50
            }));

            const realCulprit = caseData.suspects.find(s => s.isCulprit);
            setVerdictData({
              isSuccess: false,
              accused,
              realCulprit,
              title: "INDICTMENT FAILED // WRONGFUL ACCUSATION",
              summary: `Internal Legal rejected the charges against ${accused.name}. An emergency audit confirmed ${accused.name}'s alibi was verified, and the real culprit exploited the misdirection to escape.`,
              breakdown: [
                `Innocence Verified: ${accused.name} had legitimate work orders and no cryptographic signatures matching the exfiltrated payload.`,
                `The Real Perpetrator: ${realCulprit.name} (${realCulprit.role}) was the actual conspirator who breached ${caseData.crime.restrictedRoom}.`,
                `Uncovered Contradiction: ${realCulprit.name}'s badge swipe and direct encrypted relay chat at ${caseData.crime.incidentTime} went unprosecuted!`
              ],
              xpGained: 50,
              credsGained: 0,
              streak: 0
            });
          }
        }, 2700);
      };

      // ==========================================
      // TECH LAB SHOP
      // ==========================================
      const buyUpgrade = (key, cost) => {
        if (career.creds < cost) {
          audio.alert();
          showToast("⚠️ INSUFFICIENT CREDS FOR UPGRADE!");
          return;
        }
        audio.success();
        setCareer(prev => ({
          ...prev,
          creds: prev.creds - cost,
          upgrades: { ...prev.upgrades, [key]: true }
        }));
        if (key === 'extraApBattery') {
          setMaxAp(10);
          setAp(prev => prev + 2);
        }
        showToast("🛠️ RETRO-TECH UPGRADE INSTALLED!");
      };

      // Helper list of all discovered contradictions for accusation dropdown
      const allDiscoveredContradictions = useMemo(() => {
        if (!caseData) return [];
        const items = [];
        [...caseData.evidence.badgeLogs, ...caseData.evidence.chatLogs, ...caseData.evidence.networkLogs].forEach(item => {
          if (item.contradiction) {
            items.push({ id: item.id, label: `[${item.timestamp}] ${item.contradiction}` });
          }
        });
        return items;
      }, [caseData]);

      // Filtered logs
      const filteredLogs = useMemo(() => {
        if (!caseData) return [];
        let list = caseData.evidence[`${activeTab}Logs`] || [];
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(item => 
            (item.holderName && item.holderName.toLowerCase().includes(q)) ||
            (item.sender && item.sender.toLowerCase().includes(q)) ||
            (item.source && item.source.toLowerCase().includes(q)) ||
            (item.location && item.location.toLowerCase().includes(q)) ||
            (item.message && item.message.toLowerCase().includes(q)) ||
            (item.details && item.details.toLowerCase().includes(q))
          );
        }
        if (filterFlaggedOnly) {
          list = list.filter(item => item.status !== 'VERIFIED' && item.status !== 'ROUTINE' && item.status !== 'CLEAN');
        }
        return list;
      }, [caseData, activeTab, searchQuery, filterFlaggedOnly]);

      // All Pinned logs
      const pinnedLogs = useMemo(() => {
        if (!caseData) return [];
        const all = [...caseData.evidence.badgeLogs, ...caseData.evidence.chatLogs, ...caseData.evidence.networkLogs];
        return all.filter(l => pinnedLogIds.includes(l.id));
      }, [caseData, pinnedLogIds]);

      if (!caseData) {
        return <div className="p-8 text-center font-mono text-cyan-400">INITIALIZING KRONOS LOG-ANALYSIS SUBSYSTEM...</div>;
      }

      // ==========================================
      // BOSS MODE VIEW (STEALTH MOCK GRAFANA OPS)
      // ==========================================
      if (bossMode) {
        return (
          <div className="min-h-screen bg-[#111827] text-slate-300 font-sans p-6 select-text">
            {/* Realistic Datadog / Grafana Dashboard Top Bar */}
            <div className="flex items-center justify-between pb-4 border-b border-slate-700 mb-6">
              <div className="flex items-center gap-3">
                <div className="w-4 h-4 rounded bg-emerald-500 animate-pulse"></div>
                <span className="font-bold tracking-tight text-white text-lg">Grafana Cloud // Enterprise Metrics</span>
                <span className="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">cluster-us-east-prod-04</span>
                <span className="text-xs bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded border border-emerald-800">SLO: 99.98% OK</span>
              </div>

                <div className="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔓</span>
                    <span className="font-bold text-white tracking-wider">RETRO-TECH PACKET DECRYPTOR</span>
                  </div>
                  <button 
                    onClick={() => setActiveGadgetModal(null)}
                    className="text-slate-400 hover:text-white"
                  >
                    [CLOSE]
                  </button>
                </div>

                {/* Decryption Matrix Simulation */}
                <div className="bg-slate-950 p-4 rounded border border-emerald-950 mb-4 text-xs space-y-2">
                  <div className="flex justify-between text-slate-400 text-[10px]">
                    <span>CIPHER: AES-256-GCM / RSA-4096</span>
                    <span>KEY DERIVATION: {decryptStep >= 3 ? '100% SOLVED' : `${decryptStep * 33}%`}</span>
                  </div>

                  <div className="w-full bg-slate-900 h-2 rounded overflow-hidden">
                    <div 
                      className="bg-emerald-500 h-full transition-all duration-500"
                      style={{ width: `${Math.min(100, (decryptStep + 1) * 25)}%` }}
                    />
                  </div>

                  <div className="bg-slate-900/90 p-3 rounded border border-slate-800 font-mono text-emerald-400 text-[11px] min-h-[90px] flex items-center justify-center text-center">
                    {decryptStep === 0 && "EXTRACTING INITIALIZATION VECTOR (IV)..."}
                    {decryptStep === 1 && "BRUTE-FORCING PRIVATE ENTROPY POOL: 0x8F4A... 0x1B2C..."}
                    {decryptStep === 2 && "UNSCRAMBLING PACKET PAYLOAD BUFFERS..."}
                    {decryptStep >= 3 && (
                      <div className="text-white matrix-reveal">
                        <strong className="text-emerald-400 block mb-1">DECRYPTED PAYLOAD REVEALED:</strong>
                        <span className="text-slate-200">{decryptingLog.revealedMessage || decryptingLog.message}</span>
                      </div>
                    )}
                  </div>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setActiveGadgetModal(null)}
                    className="px-4 py-2 bg-emerald-900/60 hover:bg-emerald-800 text-white rounded text-xs font-bold border border-emerald-600"
                  >
                    CONFIRM & CLOSE
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 4: SURPRISE LIVE LEAK (PLOT TWIST POPUP) */}
          {/* ======================================================== */}
          {liveLeakModal && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-rose-500 alert-glow rounded-lg max-w-lg w-full p-6 font-mono shadow-[0_0_40px_rgba(244,63,94,0.6)]">
                <div className="flex items-center gap-3 text-rose-400 text-lg font-bold mb-3 pb-2 border-b border-rose-950">
                  <span className="text-2xl animate-spin">⚠️</span>
                  <span>{liveLeakModal.title}</span>
                </div>

                <p className="text-slate-200 text-xs leading-relaxed mb-5 bg-slate-950 p-4 rounded border border-slate-800">
                  {liveLeakModal.text}
                </p>

                <div className="flex justify-end gap-3 text-xs">
                  <button
                    onClick={() => {
                      setLiveLeakModal(null);
                      audio.click();
                      showToast("Live leak event bypassed.");
                    }}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-bold"
                  >
                    IGNORE / LET IT BURN (0 AP)
                  </button>

                  <button
                    onClick={liveLeakModal.onAction}
                    className="px-5 py-2 bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white rounded font-bold shadow-lg"
                  >
                    {liveLeakModal.actionText}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 5: ACCUSATION SHOWDOWN & VERIFICATION */}
          {/* ======================================================== */}
          {accusationModalOpen && (
            <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-lg max-w-xl w-full p-6 font-mono shadow-2xl">
                
                {/* When verdict is decided */}
                {verdictData ? (
                  <div>
                    <div className={`p-4 rounded-lg border mb-4 text-center ${
                      verdictData.isSuccess 
                        ? 'bg-emerald-950/60 border-emerald-500 text-emerald-400' 
                        : 'bg-rose-950/60 border-rose-500 text-rose-400'
                    }`}>
                      <div className="text-3xl mb-1">{verdictData.isSuccess ? '🏆' : '❌'}</div>
                      <h2 className="text-lg font-bold tracking-wider">{verdictData.title}</h2>
                    </div>

                    <p className="text-xs text-slate-200 leading-relaxed mb-4 bg-slate-950 p-3.5 rounded border border-slate-800">
                      {verdictData.summary}
                    </p>

                    <div className="space-y-2 mb-5 bg-slate-950 p-3.5 rounded border border-slate-800 text-xs">
                      <strong className="text-slate-400 block mb-1">CASE FORENSIC BREAKDOWN:</strong>
                      {verdictData.breakdown.map((item, i) => (
                        <div key={i} className="text-slate-300 text-[11px] flex gap-2">
                          <span className="text-cyan-400 font-bold">•</span>
                          <span>{item}</span>
                        </div>
                      ))}
                    </div>

                    <div className="flex justify-between items-center bg-slate-950/80 p-3 rounded border border-slate-800 text-xs mb-5">
                      <div>
                        <span className="text-slate-400 block text-[10px]">REWARDS GAINED:</span>
                        <span className="text-cyan-400 font-bold">+{verdictData.xpGained} XP</span>
                        <span className="text-amber-400 font-bold ml-3">+${verdictData.credsGained} Creds</span>
                      </div>
                      <div className="text-right">
                        <span className="text-slate-400 block text-[10px]">CURRENT STREAK:</span>
                        <span className="font-bold text-white text-sm">🔥 {verdictData.streak}</span>
                      </div>
                    </div>

                    <div className="flex justify-end gap-3 text-xs">
                      <button
                        onClick={() => startNewCase()}
                        className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold rounded-lg shadow-lg transition tracking-wider"
                      >
                        NEXT PROCEDURAL CASE ➔
                      </button>
                    </div>
                  </div>
                ) : verifyingStage > 0 ? (
                  /* Dramatic Multi-stage Indictment Verification */
                  <div className="text-center py-8 space-y-4">
                    <div className="w-12 h-12 rounded-full border-2 border-cyan-500 border-t-transparent animate-spin mx-auto mb-4"></div>
                    <h3 className="text-sm font-bold text-cyan-400 tracking-wider">
                      VERIFYING INDICTMENT TELEMETRY WITH INTERNAL AUDIT...
                    </h3>
                    <div className="space-y-2 text-xs text-slate-400 max-w-sm mx-auto text-left">
                      <div className={verifyingStage >= 1 ? 'text-emerald-400' : 'opacity-30'}>
                        [STAGE 1] Cross-referencing biometric identity hashes...
                      </div>
                      <div className={verifyingStage >= 2 ? 'text-emerald-400' : 'opacity-30'}>
                        [STAGE 2] Evaluating alibi location contradictions...
                      </div>
                      <div className={verifyingStage >= 3 ? 'text-emerald-400' : 'opacity-30'}>
                        [STAGE 3] Auditing cryptographic signatures and exfil payloads...
                      </div>
                      <div className={verifyingStage >= 4 ? 'text-cyan-400 font-bold' : 'opacity-30'}>
                        [STAGE 4] Finalizing indictment ruling...
                      </div>
                    </div>
                  </div>
                ) : (
                  /* Accusation Form */
                  <div>
                    <div className="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
                      <div className="flex items-center gap-2">
                        <span className="text-rose-500 text-lg">⚖️</span>
                        <h2 className="text-sm font-bold text-white tracking-wider">
                          LOCK IN FORMAL INDICTMENT
                        </h2>
                      </div>
                      <button 
                        onClick={() => setAccusationModalOpen(false)}
                        className="text-slate-400 hover:text-white text-xs"
                      >
                        [CANCEL]
                      </button>
                    </div>

                    <p className="text-xs text-slate-300 mb-4">
                      Select the prime suspect and corroborate with the key contradictions you discovered during the investigation.
                    </p>

                    <div className="space-y-3.5 mb-6 text-xs">
                      {/* Step 1: Suspect Selection */}
                      <div>
                        <label className="block text-slate-400 font-bold mb-1">
                          1. ACCUSED PRIME SUSPECT:
                        </label>
                        <select
                          value={selectedAccusedSuspectId}
                          onChange={(e) => setSelectedAccusedSuspectId(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-200 focus:outline-none focus:border-cyan-500 font-mono"
                        >
                          <option value="">-- Choose suspect to indict --</option>
                          {caseData.suspects.map(s => (
                            <option key={s.id} value={s.id}>
                              {s.name} ({s.role} - {s.dept})
                            </option>
                          ))}
                        </select>
                      </div>

                      {/* Step 2: Linked Evidence 1 */}
                      <div>
                        <label className="block text-slate-400 font-bold mb-1">
                          2. PRIMARY CONTRADICTION (BADGE / LOCATION):
                        </label>
                        <select
                          value={selectedEvidence1}
                          onChange={(e) => setSelectedEvidence1(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-200 focus:outline-none focus:border-cyan-500 font-mono text-[11px]"
                        >
                          <option value="">-- Select primary evidence --</option>
                          {allDiscoveredContradictions.map(item => (
                            <option key={item.id} value={item.id}>
                              {item.label}
                            </option>
                          ))}
                        </select>
                      </div>

                      {/* Step 3: Linked Evidence 2 */}
                      <div>
                        <label className="block text-slate-400 font-bold mb-1">
                          3. SECONDARY CONTRADICTION (CHAT / NETWORK TOKEN):
                        </label>
                        <select
                          value={selectedEvidence2}
                          onChange={(e) => setSelectedEvidence2(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-slate-200 focus:outline-none focus:border-cyan-500 font-mono text-[11px]"
                        >
                          <option value="">-- Select secondary evidence --</option>
                          {allDiscoveredContradictions.map(item => (
                            <option key={item.id} value={item.id}>
                              {item.label}
                            </option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="flex justify-end gap-3 text-xs">
                      <button
                        onClick={() => setAccusationModalOpen(false)}
                        className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded font-bold"
                      >
                        KEEP INVESTIGATING
                      </button>

                      <button
                        onClick={handleExecuteIndictment}
                        className="px-5 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded font-bold tracking-wider shadow-lg"
                      >
                        EXECUTE INDICTMENT ➔
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 6: TECH LAB UPGRADE SHOP */}
          {/* ======================================================== */}
          {techLabOpen && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-amber-500 rounded-lg max-w-lg w-full p-5 font-mono shadow-2xl">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🛠️</span>
                    <span className="font-bold text-white tracking-wider">RETRO-TECH LAB // GADGET UPGRADES</span>
                  </div>
                  <button 
                    onClick={() => setTechLabOpen(false)}
                    className="text-slate-400 hover:text-white text-xs"
                  >
                    [CLOSE]
                  </button>
                </div>

                <div className="flex justify-between items-center bg-slate-950 p-3 rounded border border-slate-800 mb-4 text-xs">
                  <span className="text-slate-400">AVAILABLE CREDITS:</span>
                  <span className="text-amber-400 font-bold text-sm">${career.creds} CREDS</span>
                </div>

                <div className="space-y-3 mb-5 text-xs">
                  {/* Upgrade 1: Overclocked AP Battery */}
                  <div className="p-3 bg-slate-950 rounded border border-slate-800 flex justify-between items-center">
                    <div>
                      <strong className="text-white block">Overclocked AP Battery</strong>
                      <span className="text-slate-400 text-[11px]">Starts every case with 10 AP instead of 8.</span>
                    </div>
                    {career.upgrades.extraApBattery ? (
                      <span className="text-emerald-400 text-[11px] font-bold">✓ INSTALLED</span>
                    ) : (
                      <button
                        onClick={() => buyUpgrade('extraApBattery', 200)}
                        className="px-3 py-1 bg-amber-950 hover:bg-amber-900 text-amber-300 border border-amber-700 rounded font-bold"
                      >
                        BUY ($200)
                      </button>
                    )}
                  </div>

                  {/* Upgrade 2: Quantum Decryptor */}
                  <div className="p-3 bg-slate-950 rounded border border-slate-800 flex justify-between items-center">
                    <div>
                      <strong className="text-white block">Quantum Decryption Subroutine</strong>
                      <span className="text-slate-400 text-[11px]">Reduces Packet Decryptor runtime and unlocks double speed.</span>
                    </div>
                    {career.upgrades.quantumDecryptor ? (
                      <span className="text-emerald-400 text-[11px] font-bold">✓ INSTALLED</span>
                    ) : (
                      <button
                        onClick={() => buyUpgrade('quantumDecryptor', 150)}
                        className="px-3 py-1 bg-amber-950 hover:bg-amber-900 text-amber-300 border border-amber-700 rounded font-bold"
                      >
                        BUY ($150)
                      </button>
                    )}
                  </div>

                  {/* Upgrade 3: Forensic Cache */}
                  <div className="p-3 bg-slate-950 rounded border border-slate-800 flex justify-between items-center">
                    <div>
                      <strong className="text-white block">Forensic RAM Cache</strong>
                      <span className="text-slate-400 text-[11px]">Displays high-probability anomalies on first load.</span>
                    </div>
                    {career.upgrades.forensicCache ? (
                      <span className="text-emerald-400 text-[11px] font-bold">✓ INSTALLED</span>
                    ) : (
                      <button
                        onClick={() => buyUpgrade('forensicCache', 250)}
                        className="px-3 py-1 bg-amber-950 hover:bg-amber-900 text-amber-300 border border-amber-700 rounded font-bold"
                      >
                        BUY ($250)
                      </button>
                    )}
                  </div>
                </div>

                <div className="flex justify-end">
                  <button
                    onClick={() => setTechLabOpen(false)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded text-xs font-bold"
                  >
                    RETURN TO CONSOLE
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* MODAL 7: CASE #001 ONBOARDING TUTORIAL */}
          {/* ======================================================== */}
          {tutorialActive && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-cyan-500 rounded-lg max-w-lg w-full p-6 font-mono shadow-2xl">
                <div className="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📁</span>
                    <span className="font-bold text-cyan-400 tracking-wider">
                      CASE PROTOCOL 101 // OPERATOR BRIEFING
                    </span>
                  </div>
                  <span className="text-xs text-slate-500">STEP {tutorialStep + 1} OF 4</span>
                </div>

                <div className="space-y-3 mb-6 text-xs text-slate-200 leading-relaxed">
                  {tutorialStep === 0 && (
                    <div>
                      <h4 className="font-bold text-white text-sm mb-1.5">1. WELCOME TO THE COLD FILE</h4>
                      <p>You are an internal SecOps threat analyst. A serious corporate crime just occurred in the building during the specified incident window.</p>
                      <p className="mt-2 text-cyan-300">This game is <strong>100% turn-based</strong> with zero real-time timers. Nothing happens until you take an action.</p>
                    </div>
                  )}

                  {tutorialStep === 1 && (
                    <div>
                      <h4 className="font-bold text-white text-sm mb-1.5">2. SUSPECTS & THE CONTRADICTION ENGINE</h4>
                      <p>Inspect the 4 suspect dossiers on the left. Each suspect claims a specific alibi.</p>
                      <p className="mt-2 text-amber-300">The actual culprit <strong>MUST have 2 subtle contradictions</strong> between their stated Alibi and the Evidence Streams (Keycards, Chats, Network Transfers).</p>
                    </div>
                  )}

                  {tutorialStep === 2 && (
                    <div>
                      <h4 className="font-bold text-white text-sm mb-1.5">3. ACTION POINTS & TACTICAL GADGETS</h4>
                      <p>You start with 8 AP compute bandwidth. Reviewing profiles is free, but deep-scanning logs or deploying gadgets costs 1 AP:</p>
                      <ul className="mt-2 space-y-1 text-slate-300">
                        <li>• <strong>Signal Tracker:</strong> Pinpoint suspect's actual room location.</li>
                        <li>• <strong>Voice Modulator:</strong> Pressure suspects to catch verbal slips.</li>
                        <li>• <strong>Packet Decryptor:</strong> Unscramble redacted hashes.</li>
                      </ul>
                    </div>
                  )}

                  {tutorialStep === 3 && (
                    <div>
                      <h4 className="font-bold text-white text-sm mb-1.5">4. THE BOSS KEY & ACCUSATION</h4>
                      <p>If someone walks behind your desk, press <strong>[Escape]</strong> or click <strong>[SYS_MODE]</strong> to instantly swap to a realistic, boring Kubernetes Grafana dashboard!</p>
                      <p className="mt-2 text-emerald-400">When you're ready, click <strong>LOCK IN ACCUSATION</strong> to convict the conspirator and earn Detective XP and Creds!</p>
                    </div>
                  )}
                </div>

                <div className="flex justify-between items-center text-xs">
                  <button
                    onClick={() => setTutorialActive(false)}
                    className="text-slate-500 hover:text-slate-300"
                  >
                    Skip Tutorial
                  </button>

                  <div className="flex gap-2">
                    {tutorialStep > 0 && (
                      <button
                        onClick={() => setTutorialStep(prev => prev - 1)}
                        className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded font-bold"
                      >
                        Back
                      </button>
                    )}
                    {tutorialStep < 3 ? (
                      <button
                        onClick={() => setTutorialStep(prev => prev + 1)}
                        className="px-4 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-slate-950 rounded font-bold"
                      >
                        Next Step ➔
                      </button>
                    ) : (
                      <button
                        onClick={() => setTutorialActive(false)}
                        className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded font-bold"
                      >
                        Begin Investigation! ➔
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER BAR */}
          <footer className="bg-slate-950/90 border-t border-slate-800/80 px-5 py-2 flex items-center justify-between text-[11px] font-mono text-slate-500">
            <div>
              <span>KRONOS LOG INVESTIGATION PLATFORM // SEC-OPS CONSOLE</span>
              <span className="mx-2">•</span>
              <span>PRESS [ESC] FOR STEALTH BOSS MODE</span>
            </div>
            <div>
              <span>ALL EVIDENCE IS AUTO-SAVED IN LOCALSTORAGE</span>
            </div>
          </footer>
        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
