      static getDerivedStateFromError() {
        return { hasError: true };
      }
      render() {

          return (
            <div className="min-h-screen bg-[#070B10] text-rose-400 font-mono flex flex-col items-center justify-center p-6 text-center">

    // ==========================================
    // 1. SOUND & AMBIENT SYNTH AUDIO ENGINE
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmEnabled = false;
        this.lastStepTime = 0;
        this.bgmTimer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.04) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      step() {
        const now = Date.now();
        if (now - this.lastStepTime < 180) return;
        this.lastStepTime = now;
        const p = 160 + Math.random() * 40;
        this.playTone(p, 'triangle', 0.035, 0.018);
      }

      interact() { this.playTone(880, 'triangle', 0.07, 0.035); }
      click() { this.playTone(1400, 'triangle', 0.02, 0.025); }

      scan() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.31);
        } catch (e) {}
      }

      sonar() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1050, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.45);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.46);
        } catch (e) {}
      }

      decrypt() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        for (let i = 0; i < 6; i++) {
          setTimeout(() => {
            this.playTone(600 + Math.random() * 800, 'sawtooth', 0.03, 0.02);
          }, i * 45);
        }
      }

      alert() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [520, 880, 520, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.045, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.085);
          });
        } catch (e) {}
      }

      success() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.11);
            gain.gain.setValueAtTime(0.05, now + idx * 0.11);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.32);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.11);
            osc.stop(now + idx * 0.11 + 0.34);
          });
        } catch (e) {}
      }

      failure() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [340, 260, 180].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.14);
            gain.gain.setValueAtTime(0.05, now + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.14);
            osc.stop(now + idx * 0.14 + 0.22);
          });
        } catch (e) {}
      }

      voiceBeep(pitch = 500) { this.playTone(pitch, 'triangle', 0.04, 0.025); }

      startBGM() {
        if (this.bgmEnabled) return;
        this.init();
        if (!this.ctx) return;
        this.bgmEnabled = true;

        const chordProg = [
          [130.81, 164.81, 196.00], // C minor
          [110.00, 130.81, 164.81], // A minor
          [146.83, 174.61, 220.00], // D minor
          [98.00, 123.47, 146.83]   // G
        ];
        let chordIdx = 0;

        const playNextChord = () => {
          if (!this.bgmEnabled || !this.ctx) return;
          const freqs = chordProg[chordIdx % chordProg.length];
          chordIdx++;
          const now = this.ctx.currentTime;
          const duration = 6.0;

          freqs.forEach((freq) => {
            try {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              const filter = this.ctx.createBiquadFilter();

              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now);

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(450, now);
              filter.frequency.exponentialRampToValueAtTime(650, now + duration / 2);
              filter.frequency.exponentialRampToValueAtTime(400, now + duration);

              gain.gain.setValueAtTime(0.0001, now);
              gain.gain.linearRampToValueAtTime(0.012, now + 1.2);
              gain.gain.linearRampToValueAtTime(0.0001, now + duration - 0.2);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(now);
              osc.stop(now + duration);
            } catch (e) {}
          });

          this.bgmTimer = setTimeout(playNextChord, (duration - 0.8) * 1000);
        };

        playNextChord();
      }

      stopBGM() {
        this.bgmEnabled = false;
        if (this.bgmTimer) clearTimeout(this.bgmTimer);
      }

        contradiction: `Badge Swipe into ${RESTRICTED_ROOM.name} at ${crime.incidentTime}:08`,
        isCulpritContradiction: true
      });

      // Chat Stream
      chatLogs.push({
        id: `chat_innocent_01`,
        timestamp: `21:42:12`,
        sender: suspects[innocentIndices[1]].name,
        channel: "#infrastructure-alerts",
        message: "Automated cron finished db snapshot without warning flags.",
        status: "ROUTINE",
        details: "Deep Scan confirms: Sent from desktop terminal in designated workspace."
      });

      chatLogs.push({
        id: `chat_culprit_contradiction`,
        timestamp: `${crime.incidentTime}:32`,
        sender: culprit.name,
        channel: "Direct Message (Encrypted Relay)",
        message: `Handshake verified. Transporting packet: ${crime.redactionMarker}. Disconnecting proxy socket.`,
        revealedMessage: `Handshake verified. Transporting packet: ${crime.redactionDecrypted}. Decrypted message: "${crime.decryptedChatPayload}"`,
        status: "HIGH_RISK",
        details: `CONTRADICTION: Encrypted socket opened by ${culprit.name} at ${crime.incidentTime}:32 communicating with external buyer while claiming to be reading offline documents!`,
        contradiction: `Encrypted Relay Chat coordinating transfer at ${crime.incidentTime}:32`,
        isCulpritContradiction: true,
        isRedacted: true
      });

      // Network Stream
      networkLogs.push({
        id: `net_culprit_contradiction`,
        timestamp: `${crime.incidentTime}:22`,
        source: `10.14.88.42 (${culprit.name}'s Static Docking IP)`,
        destination: "185.220.101.5 (Tor Bulletproof Relay)",
        protocol: crime.suspiciousProtocol,
        volume: "4.2 GB",
        status: "CRITICAL_THREAT",
        details: `CONTRADICTION: High-bandwidth transmission authenticated with ${culprit.name}'s biometric RSA token directly during the incident window!`,
        contradiction: `Anomalous ${crime.suspiciousProtocol} transmission authenticated by ${culprit.name}'s token at ${crime.incidentTime}:22`,
        isCulpritContradiction: true
      });

      return {
        caseNumber,
        caseId: `CASE-${1040 + caseNumber * 9}-${crime.typeId.split("_")[1]}`,
        crime,
        suspects,
        culpritId: culprit.id,
        culpritName: culprit.name,
        evidence: {
          badgeLogs: badgeLogs.sort((a, b) => a.timestamp.localeCompare(b.timestamp)),
          chatLogs: chatLogs.sort((a, b) => a.timestamp.localeCompare(b.timestamp)),
          networkLogs: networkLogs.sort((a, b) => a.timestamp.localeCompare(b.timestamp))
        }
      };
    }

        suspectMeshes: [],
        pedestals: [],
        radarMesh: null
      });

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Auto-save
      useEffect(() => {
        if (!caseData) return;
        try {
          localStorage.setItem('THE_COLD_FILE_STATE_3D', JSON.stringify({
            caseData, ap, maxAp, pinnedLogIds, career
          }));
        } catch (e) {}
      }, [caseData, ap, maxAp, pinnedLogIds, career]);

      // Toggle BGM
      const toggleBGM = () => {
        if (bgmActive) {
          audio.stopBGM();
          setBgmActive(false);
          showToast("🎵 Cyber-Noir BGM Paused");
        } else {
          audio.startBGM();
          setBgmActive(true);
          showToast("🎵 Cozy Lo-Fi Detective BGM Playing");
        }
      };

      // Spend AP & Chance for Surprise Plot Twist Live Leak
      const spendAP = (cost, actionName = "INVESTIGATION") => {
        if (ap < cost) {
          audio.alert();
          showToast(`⚠️ INSUFFICIENT AP! (${cost} required, ${ap} remaining)`);
          return false;
        }
        setAp(prev => prev - cost);
        audio.click();

        // 30% chance for a Dopamine Plot Twist Live Leak!
        if (Math.random() < 0.32) {
          triggerSurpriseLiveLeak();
        }
        return true;
      };

      // Trigger Surprise Live Leak Modal
      const triggerSurpriseLiveLeak = () => {
        const events = [
          {
            title: "ANONYMOUS WHISTLEBLOWER RELAY",
            desc: "An encrypted drop on an onion relay just leaked internal credentials!",
            reward: "Instantly confirmed: The culprit possesses LEVEL-4 ROOT credentials.",
            actionType: "HINT_ACCESS"
          },
          {
            title: "COVER-UP ATTEMPT INTERCEPTED",
            desc: "A workstation in the Engineering Pod attempted to force-delete bash history logs!",
            reward: "Deep Scan verified the incident occurred during the critical window.",
            actionType: "HINT_TIME"
          },
          {
            title: "ENCRYPTED DRIVE CRACKED",
            desc: "SecOps automated brute-force cracked an abandoned flash drive from the breakroom.",
            reward: "Cleared 1 innocent suspect from suspicion completely!",
            actionType: "CLEAR_SUSPECT"
          }

        const evt = events[Math.floor(Math.random() * events.length)];
        audio.alert();
        setShakeScreen(true);
        setTimeout(() => setShakeScreen(false), 400);

          const key = e.key.toLowerCase();
          if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
            e.preventDefault();
            keysPressedRef.current.add(key);
            playerRef.current.targetX = null;
            playerRef.current.targetZ = null;
          } else if (key === 'q') {
            cameraAngleRef.current -= 0.35; // Rotate camera left
          } else if (key === 'e' || e.key === ' ') {
            triggerNearbyInteraction();
          } else if (key === 'r') {
            cameraAngleRef.current += 0.35; // Rotate camera right
          }
        };

        const handleKeyUp = (e) => {
          const key = e.key.toLowerCase();
          keysPressedRef.current.delete(key);

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);

        dirLight.shadow.camera.right = 18;

        // Room Point Lights

        scene.add(vaultLight);

        const confLight = new THREE.PointLight(0xF59E0B, 1.0, 14);
        confLight.position.set(9, 3.5, -8.5);
        scene.add(confLight);

        const concourseLight = new THREE.PointLight(0x38BDF8, 0.8, 12);
        concourseLight.position.set(0, 3.5, 0);

        // 3. Build Office Environment
        const { officeGroup, serverRacks, pedestalMeshes } = build3DOfficeScene(scene);

        // 4. Create Detective Mesh

          scene.add(sMesh);
          return { id: s.id, data: s, mesh: sMesh };
        });

        // 6. 3D Radar Wave Ring (For Signal Tracker Gadget)
        const radarRingGeom = new THREE.RingGeometry(0.2, 0.45, 32);
        const radarRingMat = new THREE.MeshBasicMaterial({ color: 0xF43F5E, side: THREE.DoubleSide, transparent: true, opacity: 0 });
        const radarMesh = new THREE.Mesh(radarRingGeom, radarRingMat);
        radarMesh.rotation.x = -Math.PI / 2;
        radarMesh.position.y = 0.05;
        scene.add(radarMesh);

        // Store references
        threeRef.current = {
          scene,
          camera,
          renderer,
          playerMesh,
          suspectMeshes,
          pedestals: pedestalMeshes,
          radarMesh,
          serverRacks
        };

        // Resize handler
        const handleResize = () => {
          if (!container || !renderer || !camera) return;
          const newW = container.clientWidth;
          const newH = container.clientHeight || 560;
          if (newW > 0 && newH > 0) {
            camera.aspect = newW / newH;
            camera.updateProjectionMatrix();
            renderer.setSize(newW, newH);
          }
        };
        window.addEventListener('resize', handleResize);
        setTimeout(handleResize, 120); // Sync after initial layout pass

        // Click on 3D floor for Click-to-Move
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        const handlePointerDown = (e) => {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const targetPoint = new THREE.Vector3();
          if (raycaster.ray.intersectPlane(floorPlane, targetPoint)) {
            playerRef.current.targetX = Math.max(-13, Math.min(13, targetPoint.x));
            playerRef.current.targetZ = Math.max(-13, Math.min(13, targetPoint.z));
            audio.click();
          }
        };

        renderer.domElement.addEventListener('pointerdown', handlePointerDown);

        // Mouse wheel to zoom
        const handleWheel = (e) => {
          cameraZoomRef.current = Math.max(12, Math.min(26, cameraZoomRef.current + e.deltaY * 0.015));
        };
        renderer.domElement.addEventListener('wheel', handleWheel, { passive: true });

        // Cleanup
        return () => {
          window.removeEventListener('resize', handleResize);
          if (renderer && renderer.domElement) {
            renderer.domElement.removeEventListener('pointerdown', handlePointerDown);
            renderer.domElement.removeEventListener('wheel', handleWheel);
            renderer.dispose();
          }
        };
      }, [caseData]);

      // ==========================================
      // 7. 60FPS 3D ANIMATION & KINEMATICS LOOP
      // ==========================================
      useEffect(() => {
        let animId;
        let lastTime = performance.now();

        const loop = (currentTime) => {
          const dt = Math.min(0.04, (currentTime - lastTime) / 1000);
          lastTime = currentTime;

          const three = threeRef.current;
          if (three.renderer && three.camera && three.playerMesh) {
            const p = playerRef.current;
            const keys = keysPressedRef.current;
            const orbit = cameraAngleRef.current;

            // 1. Camera-Relative Directional Input Vector
            let inputX = 0, inputZ = 0;
            if (keys.has('w') || keys.has('arrowup')) inputZ -= 1;
            if (keys.has('s') || keys.has('arrowdown')) inputZ += 1;
            if (keys.has('a') || keys.has('arrowleft')) inputX -= 1;
            if (keys.has('d') || keys.has('arrowright')) inputX += 1;

            const camForward = new THREE.Vector3(-Math.sin(orbit), 0, -Math.cos(orbit));
            const camRight = new THREE.Vector3(Math.cos(orbit), 0, -Math.sin(orbit));

            const moveDir = new THREE.Vector3();
            if (inputZ < 0) moveDir.add(camForward);
            if (inputZ > 0) moveDir.sub(camForward);
            if (inputX > 0) moveDir.add(camRight);
            if (inputX < 0) moveDir.sub(camRight);

            const accel = 26; // Smooth 3D acceleration
            const friction = 0.82;
            const maxSpeed = 7.5;

            if (moveDir.lengthSq() > 0) {
              moveDir.normalize();
              p.vx += moveDir.x * accel * dt;
              p.vz += moveDir.z * accel * dt;
              p.isWalking = true;
              audio.step();
            } else if (p.targetX !== null && p.targetZ !== null) {
              const dx = p.targetX - p.x;
              const dz = p.targetZ - p.z;
              const dist = Math.hypot(dx, dz);

              if (dist > 0.25) {
                p.vx += (dx / dist) * accel * dt;
                p.vz += (dz / dist) * accel * dt;
                p.isWalking = true;
                audio.step();
              } else {
                p.targetX = null;
                p.targetZ = null;
              }
            }

            // Apply friction
            p.vx *= friction;
            p.vz *= friction;

            const currentSpeed = Math.hypot(p.vx, p.vz);
            if (currentSpeed > maxSpeed) {
              p.vx = (p.vx / currentSpeed) * maxSpeed;
              p.vz = (p.vz / currentSpeed) * maxSpeed;
            }

            // Wall-Sliding Collision in 3D
            const nextX = p.x + p.vx * dt;
            const nextZ = p.z + p.vz * dt;

            // Boundary clamp
            p.x = Math.max(-13.5, Math.min(13.5, nextX));
            p.z = Math.max(-13.5, Math.min(13.5, nextZ));

            // Smooth Character Heading Rotation
            if (currentSpeed > 0.4) {
              p.walkProgress += dt * 11;
              p.rotationY = Math.atan2(p.vx, p.vz);
            } else {
              p.isWalking = false;
            }

            three.playerMesh.position.set(p.x, 0, p.z);
            three.playerMesh.rotation.y = p.rotationY;
            three.playerMesh.userData.animate(dt, p.isWalking, p.walkProgress, currentTime / 1000);

            // Animate Suspects (Breathing & Subtle Head Tilts)
            three.suspectMeshes.forEach(sm => {
              sm.mesh.userData.animate(dt, false, 0, currentTime / 1000);
            });

            // Smooth 3D Camera Tracking with Isometric Perspective
            const camDist = cameraZoomRef.current;
            const targetCamX = p.x + Math.sin(orbit) * camDist;
            const targetCamZ = p.z + Math.cos(orbit) * camDist;
            const targetCamY = 14 + camDist * 0.35;

            three.camera.position.lerp(new THREE.Vector3(targetCamX, targetCamY, targetCamZ), dt * 7);
            three.camera.lookAt(p.x, 0.8, p.z);

            // 2. Proximity Check for Interactions
            let found = null;
            let foundId = null;

            // Check suspects
            for (const sm of three.suspectMeshes) {
              const dist = Math.hypot(sm.data.posX - p.x, sm.data.posZ - p.z);
              if (dist < 2.5) {
                found = { type: 'suspect', data: sm.data, label: `[E] QUESTION ${sm.data.name.toUpperCase()}` };
                foundId = sm.id;
                break;
              }
            }

            // Check pedestals
            if (!found) {
              for (const ped of three.pedestals) {
                const dist = Math.hypot(ped.pos[0] - p.x, ped.pos[2] - p.z);
                if (dist < 2.4) {
                  found = { type: 'node', data: ped, label: `[E] ${ped.name.toUpperCase()}` };
                  foundId = ped.id;
                  break;
                }
              }
            }

            if (foundId !== currentTargetIdRef.current) {
              currentTargetIdRef.current = foundId;
              setInteractTarget(found);
            }

            // 3. Render WebGL Frame
            three.renderer.render(three.scene, three.camera);
          }

          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animId);
      }, []);

              </div>

                <div className="text-2xl font-bold text-cyan-400 mt-1">64 / 64 Healthy</div>
              </div>
              <div className="p-4 bg-slate-900 rounded border border-slate-800">
                <div className="text-xs text-slate-400">Error Budget Burn</div>
                <div className="text-2xl font-bold text-indigo-400 mt-1">0.02% / 24h</div>
              </div>
            </div>
            <div className="h-64 bg-slate-950 rounded flex items-center justify-center text-xs text-slate-500 font-mono border border-slate-800">
              [SYSTEM API LATENCY & SERVER HEALTH TELEMETRY NORMAL]

          </div>

              <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
              <span className="font-bold">{toastMsg}</span>

          {/* TOP HIGH-TECH CYBER HEADER */}
          <header className="bg-[#0F1722] border-b-2 border-[#223449] px-4 py-2.5 flex items-center justify-between text-xs sticky top-0 z-30 shadow-xl">

                <button

                    <span className="text-cyan-400">MOVE: [WASD] / CLICK FLOOR | ROTATE: [Q] / [R]</span>

                  {/* 3D Container */}

                    ref={canvasContainerRef}
                    style={{ width: '100%', height: '560px', minHeight: '520px' }}
                    className="w-full relative rounded overflow-hidden cursor-crosshair bg-[#070B10]"
                  />

                  {/* Floating Proximity Pill */}
                  {interactTarget && (
                    <div className="absolute bottom-5 left-1/2 transform -translate-x-1/2 z-20 bg-[#070B10]/95 border-2 border-cyan-400 text-cyan-300 px-5 py-2.5 rounded-full shadow-[0_0_20px_rgba(56,189,248,0.5)] font-pixel text-xs animate-bounce cursor-pointer flex items-center gap-2"
                         onClick={triggerNearbyInteraction}>

                  )}
                </div>

                {/* Cyber Sidebar: Suspects & Gadget Dock (Fixed 360px on Desktop) */}
                <div className="w-full lg:w-[360px] xl:w-[400px] shrink-0 flex flex-col gap-3">
                  {/* AP Power Cells */}
                  <div className="cyber-card p-3.5">
                    <div className="flex justify-between items-center text-xs mb-2.5">
                      <span className="font-bold text-cyan-400 font-pixel text-[10px]">COMPUTE AP</span>
                      <span className="text-amber-400 font-bold">🔥 Streak: {career.streak}</span>
                    </div>
                    <div className="grid grid-cols-8 gap-1.5 mb-2">
                      {Array.from({ length: maxAp }).map((_, i) => (
                        <div
                          key={i}
                          className={`h-4 rounded border transition-all duration-300 ${
                            i < ap
                              ? 'bg-cyan-400 border-cyan-200 shadow-[0_0_10px_rgba(56,189,248,0.9)]'
                              : 'bg-black border-[#223449] opacity-20'
                          }`}
                        />
                      ))}
                    </div>
                  </div>

                  {/* Detective Gadgets Dock */}
                  <div className="cyber-card p-3.5">
                    <div className="text-xs font-bold text-white mb-2 font-pixel text-[10px] text-cyan-400">
                      TACTICAL GADGETS DOCK
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <button
                        onClick={() => {
                          if (!spendAP(1, "SIGNAL_TRACKER")) return;
                          audio.sonar();
                          const rMesh = threeRef.current.radarMesh;
                          if (rMesh) {
                            rMesh.material.opacity = 0.9;
                            rMesh.position.set(RESTRICTED_ROOM.posX, 0.05, RESTRICTED_ROOM.posZ);
                            let scale = 1;
                            const expand = () => {
                              scale += 0.4;
                              rMesh.scale.set(scale, scale, 1);
                              rMesh.material.opacity -= 0.035;
                              if (rMesh.material.opacity > 0) requestAnimationFrame(expand);
                            };
                            expand();
                          }
                          showToast(`📡 SONAR PING: An active RFID beacon was detected inside ${RESTRICTED_ROOM.name}!`);
                        }}
                        className="p-2.5 cyber-btn text-cyan-300 font-bold flex flex-col items-center justify-center gap-1"
                      >
                        <span className="text-base">📡</span>
                        <span className="text-[10px]">RADAR PING (1 AP)</span>
                      </button>

                      <button
                        onClick={() => {
                          if (!spendAP(1, "DECRYPTOR")) return;
                          audio.decrypt();
                          // Decrypt chat logs
                          const nextChat = caseData.evidence.chatLogs.map(c => {
                            if (c.isRedacted) {
                              return { ...c, message: c.revealedMessage, isRedacted: false };
                            }
                            return c;
                          });
                          setCaseData(prev => ({
                            ...prev,
                            evidence: { ...prev.evidence, chatLogs: nextChat }
                          }));
                          showToast("🔓 PACKET DECRYPTED: [REDACTED] logs successfully unscrambled!");
                        }}
                        className="p-2.5 cyber-btn text-emerald-300 font-bold flex flex-col items-center justify-center gap-1"
                      >
                        <span className="text-base">🔓</span>
                        <span className="text-[10px]">DECRYPTOR (1 AP)</span>
                      </button>
                    </div>
                  </div>

                  {/* Campus Suspect Dossiers */}
                  <div className="cyber-card p-3.5 flex-1 flex flex-col">
                    <div className="flex justify-between items-center mb-2.5">
                      <span className="text-xs font-bold text-white tracking-wider font-pixel text-[10px]">CAMPUS SUSPECTS (4)</span>
                      <span className="text-[10px] text-slate-400">CLICK TO TARGET</span>
                    </div>

                    <div className="space-y-2 flex-1 overflow-y-auto max-h-[290px]">
                      {caseData.suspects.map(s => (
                        <div
                          key={s.id}
                          onClick={() => { setActiveSuspectModal(s); audio.click(); }}
                          className="p-2.5 bg-[#0A0F15] border border-[#223449] hover:border-cyan-400 rounded-lg cursor-pointer transition flex items-center justify-between group"
                        >
                          <div>
                            <div className="font-bold text-white text-xs group-hover:text-cyan-300 transition">{s.name}</div>
                            <div className="text-[10px] text-slate-400">{s.statedRoom}</div>
                          </div>
                          <span className="text-xs font-pixel text-[9px] text-cyan-400 group-hover:scale-105 transition">[INTERROGATE]</span>
                        </div>
                      ))}
                    </div>

                    <button
                      onClick={() => setAccusationModalOpen(true)}
                      className="mt-3.5 w-full py-3.5 bg-gradient-to-r from-rose-700 via-red-600 to-amber-700 hover:from-rose-600 hover:to-amber-600 text-white font-bold text-xs rounded-lg border border-rose-400 shadow-[0_0_20px_rgba(244,63,94,0.4)] tracking-wider font-pixel text-[10px]"
                    >
                      ⚖️ LOCK IN ACCUSATION
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex-1 cyber-card p-4 flex flex-col shadow-2xl">
                <div className="flex items-center gap-2 pb-3 border-b border-[#223449] mb-3 text-xs font-bold">
                  <button onClick={() => setActiveTab('badge')} className={`px-3 py-1.5 rounded ${activeTab === 'badge' ? 'bg-cyan-600 text-white shadow-lg' : 'bg-[#0A0F15] text-slate-400'}`}>
                    💳 KEYCARDS ({caseData.evidence.badgeLogs.length})
                  </button>
                  <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded ${activeTab === 'chat' ? 'bg-amber-600 text-white shadow-lg' : 'bg-[#0A0F15] text-slate-400'}`}>
                    💬 CHATS ({caseData.evidence.chatLogs.length})
                  </button>
                  <button onClick={() => setActiveTab('network')} className={`px-3 py-1.5 rounded ${activeTab === 'network' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-[#0A0F15] text-slate-400'}`}>
                    🌐 NETWORK ({caseData.evidence.networkLogs.length})
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2.5 text-xs">
                  {caseData.evidence[`${activeTab}Logs`].map(item => (
                    <div key={item.id} className="p-3 bg-[#0A0F15] border border-[#223449] rounded-lg">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-cyan-400 font-bold">[{item.timestamp}] {item.holderName || item.sender || item.source}</span>
                        <span className="text-slate-400 text-[10px]">{item.location || item.channel || item.protocol}</span>
                      </div>
                      <p className="text-slate-200 text-xs leading-relaxed">{item.details || item.message}</p>
                      {item.contradiction && (
                        <div className="mt-2 text-rose-400 font-bold text-[11px] bg-rose-950/40 p-2 rounded border border-rose-800">
                          CONTRADICTION DETECTED: {item.contradiction}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* SPROUT LANDS CHIBI DIALOGUE BUST MODAL */}
          {activeSuspectModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="cyber-card border-2 border-cyan-400 rounded-xl max-w-xl w-full p-5 shadow-2xl">
                <div className="flex justify-between items-center pb-2.5 border-b border-[#223449] mb-4">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-white text-base font-pixel text-xs">{activeSuspectModal.name}</span>
                    <span className="text-xs text-slate-400">({activeSuspectModal.badgeId})</span>
                  </div>
                  <button onClick={() => setActiveSuspectModal(null)} className="text-slate-400 hover:text-white text-xs font-bold">[CLOSE ✕]</button>
                </div>

                {/* Suspect Information & Stress */}
                <div className="space-y-2.5 text-xs mb-4">
                  <div className="bg-[#0A0F15] p-2.5 rounded border border-[#223449]">
                    <span className="text-slate-400 block text-[10px]">ROLE & CLEARANCE:</span>
                    <span className="text-cyan-400 font-bold">{activeSuspectModal.role} ({activeSuspectModal.accessLevel})</span>
                  </div>

                  <div className="bg-[#0A0F15] p-2.5 rounded border border-[#223449]">
                    <span className="text-amber-400 block text-[10px] font-bold">STATED ALIBI:</span>
                    <p className="text-slate-200 mt-0.5 text-xs leading-relaxed">{activeSuspectModal.statedAlibi}</p>
                  </div>

                  {/* Suspect Stress Meter */}
                  <div className="bg-[#0A0F15] p-2 rounded border border-[#223449]">
                    <div className="flex justify-between text-[10px] mb-1">
                      <span className="text-slate-400">PSYCHOLOGICAL STRESS:</span>
                      <span className={`font-bold ${activeSuspectModal.stressLevel > 60 ? 'text-rose-400' : 'text-emerald-400'}`}>
                        {activeSuspectModal.stressLevel}%
                      </span>
                    </div>
                    <div className="h-2 bg-black rounded-full overflow-hidden">
                      <div
                        className={`h-full transition-all duration-300 ${activeSuspectModal.stressLevel > 60 ? 'bg-rose-500 shadow-[0_0_8px_#F43F5E]' : 'bg-emerald-500'}`}
                        style={{ width: `${activeSuspectModal.stressLevel}%` }}
                      />
                    </div>
                  </div>
                </div>

                {interrogationDialogue && (
                  <div className="bg-[#0A0F15] p-3 rounded-lg border border-amber-500/40 text-amber-200 text-xs mb-4 leading-relaxed">
                    <strong>SUSPECT RESPONSE:</strong> "{interrogationDialogue}"
                  </div>
                )}

                {/* Interrogation Actions */}
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <button
                    onClick={() => {
                      if (!spendAP(1, "TRACKER")) return;
                      audio.scan();
                      setActiveSuspectModal(null);
                      const isMatch = activeSuspectModal.actualRoom === activeSuspectModal.statedRoom;
                      showToast(isMatch ? `✓ RFID Confirmed in ${activeSuspectModal.statedRoom}` : `🚨 RFID Detected inside ${RESTRICTED_ROOM.name}!`);
                    }}
                    className="p-3 cyber-btn text-cyan-300 font-bold"
                  >
                    📡 SCAN RFID (1 AP)
                  </button>

                  <button
                    onClick={() => {
                      if (!spendAP(1, "INTERROGATE")) return;
                      const newStress = Math.min(100, activeSuspectModal.stressLevel + 25);
                      activeSuspectModal.stressLevel = newStress;

                      let reply = "";
                      if (activeSuspectModal.isCulprit) {
                        reply = newStress > 60 ? caseData.crime.alibiSlipDialogue : "I already told you my alibi. What reason would I have to breach the core vault?";
                      } else {
                        reply = "Check my git commits or cafeteria logs! I was nowhere near the vault during the incident.";
                      }
                      setInterrogationDialogue(reply);
                      audio.voiceBeep(480);
                    }}
                    className="p-3 cyber-btn text-amber-300 font-bold"
                  >
                    🎙️ PRESS ON ALIBI (1 AP)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SURPRISE LIVE LEAK POPUP MODAL */}
          {liveLeakModal && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="cyber-card border-2 border-rose-500 rounded-xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex items-center gap-2 mb-3 text-rose-400 font-pixel text-xs">
                  <span className="text-xl">🚨</span>
                  <span>SURPRISE INTERCEPT ALERT</span>
                </div>
                <h3 className="text-white font-bold text-sm mb-2">{liveLeakModal.title}</h3>
                <p className="text-slate-300 text-xs mb-3 leading-relaxed">{liveLeakModal.desc}</p>
                <div className="bg-[#0A0F15] p-3 rounded border border-rose-500/50 text-rose-300 text-xs font-bold mb-4">
                  {liveLeakModal.reward}
                </div>
                <button
                  onClick={() => setLiveLeakModal(null)}
                  className="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-xs"
                >
                  DISMISS & RESUME INVESTIGATION
                </button>
              </div>
            </div>
          )}

          {/* ACCUSATION SHOWDOWN MODAL */}
          {accusationModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="cyber-card border-2 border-rose-500 rounded-xl max-w-lg w-full p-6 shadow-2xl">
                {verdictData ? (
                  <div>
                    <h2 className="text-base font-bold text-center mb-3 text-white font-pixel">
                      {verdictData.isSuccess ? '🏆 GUILTY VERDICT CONFIRMED!' : '❌ WRONGFUL ACCUSATION!'}
                    </h2>
                    <p className="text-xs text-slate-300 mb-4 bg-[#0A0F15] p-3.5 rounded-lg border border-[#223449] leading-relaxed">
                      {verdictData.summary}
                    </p>
                    <button
                      onClick={() => {
                        setAccusationModalOpen(false);
                        setVerdictData(null);
                        setCaseData(generateCaseData(caseData.caseNumber + 1));
                        setAp(8);
                      }}
                      className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-black font-bold rounded-lg text-xs font-pixel"
                    >
                      PROCEED TO NEXT CASE ➔
                    </button>
                  </div>
                ) : (
                  <div>
                    <h2 className="text-xs font-bold text-white mb-3 font-pixel">LOCK IN ACCUSATION SHOWDOWN</h2>
                    <p className="text-[11px] text-slate-400 mb-3">
                      Select the primary culprit to indict. Contradictions cross-reference automatically against logged biometric and network evidence.
                    </p>

                    <label className="text-[10px] text-slate-400 block mb-1">SELECT SUSPECT TO INDICT:</label>
                    <select
                      value={selectedAccusedSuspectId}
                      onChange={(e) => setSelectedAccusedSuspectId(e.target.value)}
                      className="w-full bg-[#0A0F15] border border-[#223449] rounded-lg p-2.5 text-white text-xs mb-4"
                    >
                      <option value="">-- Choose suspect to indict --</option>
                      {caseData.suspects.map(s => (
                        <option key={s.id} value={s.id}>{s.name} ({s.role})</option>
                      ))}
                    </select>

                    <div className="flex justify-end gap-2 text-xs">
                      <button onClick={() => setAccusationModalOpen(false)} className="px-4 py-2 cyber-btn text-slate-300">
                        CANCEL
                      </button>
                      <button
                        onClick={() => {
                          const accused = caseData.suspects.find(s => s.id === selectedAccusedSuspectId);
                          if (!accused) return;
                          if (accused.isCulprit) {
                            audio.success();
                            setVerdictData({
                              isSuccess: true,
                              summary: `Case solved! ${accused.name} was taken into custody after their RFID swipe into ${RESTRICTED_ROOM.name} shattered their alibi. Motive: ${accused.motive}`
                            });
                            setCareer(prev => ({
                              ...prev,
                              streak: prev.streak + 1,
                              xp: prev.xp + 250,
                              rankTitle: "Chief SecOps Investigator"
                            }));
                          } else {
                            audio.failure();
                            setVerdictData({
                              isSuccess: false,
                              summary: `Wrongful accusation! ${accused.name} was fully innocent. The real culprit was ${caseData.culpritName}!`
                            });
                            setCareer(prev => ({ ...prev, streak: 0 }));
                          }
                        }}
                        className="px-5 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg"
                      >
                        INDICT TARGET ➔
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          <footer className="bg-[#0F1722] border-t border-[#223449] px-4 py-2 flex items-center justify-between text-[11px] text-slate-400">
            <span>THE COLD FILE // 3D LOW-POLY CYBER MYSTERY</span>
            <span>PRESS [ESC] FOR STEALTH BOSS MODE</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
