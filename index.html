    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.lastStepTime = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.04) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      step() {
        const now = Date.now();
        if (now - this.lastStepTime < 180) return; // rate limit footsteps
        this.lastStepTime = now;
        // Organic pitch variation between 165Hz and 205Hz
        const p = 165 + Math.random() * 40;
        this.playTone(p, 'triangle', 0.035, 0.02);
      }

      interact() { this.playTone(920, 'square', 0.06, 0.03); }

        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.28);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();

    function drawPixelChibiCharacter(ctx, x, y, theme, facing = 'down', walkCycle = 0, isWalking = false) {
      if (!ctx) return;
      const t = theme || SPRITE_THEMES[0] || DETECTIVE_THEME;
      const drawX = isNaN(x) ? 100 : Math.floor(x);
      const drawY = isNaN(y) ? 100 : Math.floor(y);

      ctx.save();
      ctx.translate(drawX, drawY);

      // Smooth sine bobbing and leg stride cycle (4 phases: 0, 1, 2, 3)
      const phase = Math.floor(walkCycle) % 4;
      const bobY = isWalking ? (phase % 2 === 0 ? -1.5 : 0) : Math.sin(Date.now() / 360) * 0.8;
      const legStride = isWalking ? (phase === 0 ? 3 : phase === 2 ? -3 : 0) : 0;
      const armStride = isWalking ? (phase === 0 ? -2 : phase === 2 ? 2 : 0) : 0;

      // Drop shadow with smooth breathing width
      ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
      ctx.beginPath();
      ctx.ellipse(12, 29, isWalking ? 8 : 9, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();

      const p = (px, py, w, h, color) => {
        ctx.fillStyle = color || "#FFF";
        ctx.fillRect(px, py + bobY, w, h);
      };

      // 1. BOOTS & LEGS (Fold-over cuffs with gold buttons)
      p(6 - legStride, 20, 4, 7, t.pants);
      p(5 - legStride, 22, 5, 6, t.boots);
      p(5 - legStride, 21, 5, 2, t.bootCuffs);
      p(6 - legStride, 24, 1, 2, t.cuffGold);

      p(14 + legStride, 20, 4, 7, t.pants);
      p(14 + legStride, 22, 5, 6, t.boots);
      p(14 + legStride, 21, 5, 2, t.bootCuffs);

      p(7, 13, 10, 8, t.shirt);
      p(8, 14, 8, 7, t.vest);
      p(8, 17, 8, 4, t.vestShadow);
      p(11, 15, 2, 1, t.cuffGold);
      p(11, 17, 2, 1, t.cuffGold);
      p(11, 19, 2, 1, t.cuffGold);

      // Left Arm with stride
      p(4, 14 + armStride, 3, 5, t.shirt);
      p(4, 18 + armStride, 3, 3, t.gloves);
      p(4, 17 + armStride, 3, 1, t.cuffGold);

      // Right Arm with opposite stride
      p(17, 14 - armStride, 3, 5, t.shirt);
      p(17, 18 - armStride, 3, 3, t.gloves);
      p(17, 17 - armStride, 3, 1, t.cuffGold);

      // 3. HEAD & FACE
      p(10, 11, 4, 2, t.skinShadow);
      p(6, 6, 12, 6, t.skin);
      p(5, 7, 1, 4, t.skin);
      p(18, 7, 1, 4, t.skin);

      if (facing !== 'up') {
        const eyeOffset = facing === 'left' ? -1 : facing === 'right' ? 1 : 0;
        p(8 + eyeOffset, 8, 2, 3, t.eye);
        p(8 + eyeOffset, 8, 1, 1, "#FFFFFF");

        p(14 + eyeOffset, 8, 2, 3, t.eye);
        p(14 + eyeOffset, 8, 1, 1, "#FFFFFF");

      ctx.restore();
    }

    // ==========================================
    // 4. 2D TILEMAP & WORLD ENGINE
    // ==========================================
    const MAP_WIDTH = 30;
    const MAP_HEIGHT = 22;
    const TILE_SIZE = 24;

    const INTERACTIVE_NODES = [
      { id: "node_badge", name: "Keycard Security Gate", tileX: 15, tileY: 5, type: "badge", label: "[E] SWIPE LOGS", icon: "💳" },
      { id: "node_chat", name: "SecOps Chat Terminal", tileX: 13, tileY: 15, type: "chat", label: "[E] CHAT RELAY", icon: "💬" },
      { id: "node_net", name: "Core Network Rack", tileX: 17, tileY: 15, type: "network", label: "[E] PCAP TRACE", icon: "🌐" },
      { id: "node_crime_tape", name: "Breached Vault Safe", tileX: 7, tileY: 4, type: "crime_scene", label: "[E] CRIME SCENE", icon: "🚨" }
    ];

    function drawWorldTilemap(ctx, width, height, time) {
      if (!ctx) return;
      for (let y = 0; y < MAP_HEIGHT; y++) {
        for (let x = 0; x < MAP_WIDTH; x++) {
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;

          if (x === 0 || y === 0 || x === MAP_WIDTH - 1 || y === MAP_HEIGHT - 1) {
            ctx.fillStyle = "#161B22";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#30363D";
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
            continue;
          }

          if (x < 13 && y < 10) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#0D1117" : "#161B22";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            if (x === 12 || y === 9) {
              ctx.fillStyle = "#991B1B";
              ctx.fillRect(px, py, TILE_SIZE, 3);
            }
          } else if (x > 17 && y < 10) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#1C2430" : "#242E3D";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          } else if (x < 13 && y > 12) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#13233A" : "#1B2A4A";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          } else if (x > 17 && y > 12) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#2B1724" : "#381E2F";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          } else {
            ctx.fillStyle = "#111827";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#1F2937";
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // Walls
      ctx.fillStyle = "#30363D";
      ctx.fillRect(13 * TILE_SIZE, 1 * TILE_SIZE, 4, 8 * TILE_SIZE);
      ctx.fillRect(17 * TILE_SIZE, 1 * TILE_SIZE, 4, 8 * TILE_SIZE);
      ctx.fillRect(13 * TILE_SIZE, 13 * TILE_SIZE, 4, 8 * TILE_SIZE);
      ctx.fillRect(17 * TILE_SIZE, 13 * TILE_SIZE, 4, 8 * TILE_SIZE);
      ctx.fillRect(1 * TILE_SIZE, 9 * TILE_SIZE, 12 * TILE_SIZE, 4);
      ctx.fillRect(18 * TILE_SIZE, 9 * TILE_SIZE, 11 * TILE_SIZE, 4);
      ctx.fillRect(1 * TILE_SIZE, 13 * TILE_SIZE, 12 * TILE_SIZE, 4);
      ctx.fillRect(18 * TILE_SIZE, 13 * TILE_SIZE, 11 * TILE_SIZE, 4);

      // Conference Table
      ctx.fillStyle = "#78350F";
      ctx.fillRect(20 * TILE_SIZE, 4 * TILE_SIZE, 7 * TILE_SIZE, 3 * TILE_SIZE);
      ctx.fillStyle = "#92400E";
      ctx.fillRect(20 * TILE_SIZE + 2, 4 * TILE_SIZE + 2, 7 * TILE_SIZE - 4, 3 * TILE_SIZE - 4);
      ctx.fillStyle = "#94A3B8";
      ctx.fillRect(21 * TILE_SIZE, 5 * TILE_SIZE, 12, 10);
      ctx.fillRect(24 * TILE_SIZE, 5 * TILE_SIZE, 12, 10);

      // Animated Blinking Server Racks (Chaser LEDs)
      for (let r = 0; r < 4; r++) {
        const rx = (3 + r * 2.5) * TILE_SIZE;
        const ry = 3 * TILE_SIZE;
        ctx.fillStyle = "#0F172A";
        ctx.fillRect(rx, ry, 36, 60);
        ctx.strokeStyle = "#334155";
        ctx.strokeRect(rx, ry, 36, 60);
        const blink1 = Math.floor(time / 160 + r) % 2 === 0;
        const blink2 = Math.floor(time / 240 + r * 2) % 3 === 0;
        ctx.fillStyle = blink1 ? "#22C55E" : "#15803D";
        ctx.fillRect(rx + 6, ry + 10, 4, 4);
        ctx.fillStyle = blink2 ? "#EF4444" : "#991B1B";
        ctx.fillRect(rx + 14, ry + 10, 4, 4);
        ctx.fillStyle = "#38BDF8";
        ctx.fillRect(rx + 22, ry + 10, 4, 4);
      }

      // Animated Crime Tape (gentle wave)
      const wave = Math.sin(time / 400) * 1.5;
      ctx.fillStyle = "#EAB308";
      ctx.fillRect(10 * TILE_SIZE, 9 * TILE_SIZE - 2 + wave, 3 * TILE_SIZE, 4);

      // Animated Water Cooler Bubble
      const bubbleY = 15 * TILE_SIZE + 18 - ((time / 30) % 14);
      ctx.fillStyle = "rgba(56, 189, 248, 0.7)";
      ctx.fillRect(2 * TILE_SIZE + 8, bubbleY, 3, 3);

      // Labels
      ctx.font = "bold 9px 'Press Start 2P', monospace";
      ctx.fillStyle = "#EF4444";
      ctx.fillText("RESTRICTED SERVER VAULT", 2 * TILE_SIZE, 2.2 * TILE_SIZE);
      ctx.fillStyle = "#38BDF8";
      ctx.fillText("CONFERENCE ROOM 4A", 19 * TILE_SIZE, 2.2 * TILE_SIZE);
      ctx.fillStyle = "#10B981";
      ctx.fillText("CAFETERIA & BREAKROOM", 2 * TILE_SIZE, 13.8 * TILE_SIZE);
      ctx.fillStyle = "#F43F5E";
      ctx.fillText("EXECUTIVE LOUNGE", 19 * TILE_SIZE, 13.8 * TILE_SIZE);
    }

    // ==========================================
    // 5. MAIN REACT APP (SMOOTH MOVEMENT & KINEMATICS)
    // ==========================================
    function App() {
      const [caseData, setCaseData] = useState(() => {
        try {
          const saved = localStorage.getItem('THE_COLD_FILE_STATE_V2');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.caseData && parsed.caseData.suspects && parsed.caseData.suspects[0]?.spriteTheme) {
              return parsed.caseData;
            }
          }
        } catch (e) {}
        return generateCaseData(1);
      });

      const [ap, setAp] = useState(8);
      const [maxAp, setMaxAp] = useState(8);
      const [viewMode, setViewMode] = useState('map');
      const [activeTab, setActiveTab] = useState('badge');
      const [pinnedLogIds, setPinnedLogIds] = useState([]);

      // BUTTERY SMOOTH KINEMATICS STATE (Using ref for 60fps physics)
      const playerRef = useRef({
        x: 15 * TILE_SIZE,
        y: 10 * TILE_SIZE,
        targetX: null,
        targetY: null,
        facing: 'down',
        walkCycle: 0,
        isWalking: false,
        lastStepSound: 0
      });

      // Dust particles array
      const dustParticlesRef = useRef([]);

      // Click-to-move target cursor ripple
      const targetCursorRef = useRef(null); // { x, y, spawnTime }

      const [interactTarget, setInteractTarget] = useState(null);
      const [radarBeacon, setRadarBeacon] = useState(null);

      // Modals
      const [activeSuspectModal, setActiveSuspectModal] = useState(null);
      const [activeNodeModal, setActiveNodeModal] = useState(null);
      const [accusationModalOpen, setAccusationModalOpen] = useState(false);
      const [selectedAccusedSuspectId, setSelectedAccusedSuspectId] = useState('');
      const [verdictData, setVerdictData] = useState(null);
      const [shakeScreen, setShakeScreen] = useState(false);

      const [career, setCareer] = useState({ xp: 150, streak: 0 });
      const [bossMode, setBossMode] = useState(false);
      const [soundMuted, setSoundMuted] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      const canvasRef = useRef(null);
      const keysPressedRef = useRef(new Set());

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Auto-save with V2 key
      useEffect(() => {
        if (!caseData) return;
        try {
          localStorage.setItem('THE_COLD_FILE_STATE_V2', JSON.stringify({
            caseData, ap, maxAp, pinnedLogIds, career
          }));
        } catch (e) {}
      }, [caseData, ap, maxAp, pinnedLogIds, career]);

      // KEYBOARD INPUT LISTENER (CONTINUOUS SMOOTH TRACKING)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setBossMode(prev => !prev);
            return;
          }
          if (activeSuspectModal || activeNodeModal || accusationModalOpen) return;

          const key = e.key.toLowerCase();
          if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
            e.preventDefault();
            keysPressedRef.current.add(key);
            // Keyboard immediately overrides click destination
            playerRef.current.targetX = null;
            playerRef.current.targetY = null;
            targetCursorRef.current = null;
          } else if (key === 'e' || e.key === ' ') {
            triggerNearbyInteraction();
          }
        };

        const handleKeyUp = (e) => {
          const key = e.key.toLowerCase();
          keysPressedRef.current.delete(key);
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [activeSuspectModal, activeNodeModal, accusationModalOpen, interactTarget]);

      const triggerNearbyInteraction = () => {
        if (!interactTarget) return;
        audio.interact();
        if (interactTarget.type === 'suspect') {
          setActiveSuspectModal(interactTarget.data);
        } else if (interactTarget.type === 'node') {
          const node = interactTarget.data;
          if (node.type === 'crime_scene') {
            showToast("🚨 CRIME SCENE: Severe breach detected in vault safe!");
            audio.alert();
          } else {
            setActiveTab(node.type);
            setActiveNodeModal(node);
          }
        }
      };

      const spendAP = (cost) => {
        if (ap < cost) {
          audio.alert();
          showToast(`⚠️ INSUFFICIENT AP! (${cost} required, ${ap} left)`);
          return false;
        }
        setAp(prev => prev - 1);
        audio.click();
        return true;
      };

      // ==========================================
      // BUTTERY SMOOTH 60FPS PHYSICS & RENDER LOOP
      // ==========================================
      useEffect(() => {
        let animId;
        let lastTime = performance.now();

        const gameLoop = (currentTime) => {
          const dt = Math.min(0.06, (currentTime - lastTime) / 1000); // capped delta time
          lastTime = currentTime;

          try {
            const canvas = canvasRef.current;
            const p = playerRef.current;
            const keys = keysPressedRef.current;

            // 1. UPDATE KINEMATICS & VELOCITY
            let moveX = 0;
            let moveY = 0;

            if (keys.has('w') || keys.has('arrowup')) { moveY -= 1; p.facing = 'up'; }
            if (keys.has('s') || keys.has('arrowdown')) { moveY += 1; p.facing = 'down'; }
            if (keys.has('a') || keys.has('arrowleft')) { moveX -= 1; p.facing = 'left'; }
            if (keys.has('d') || keys.has('arrowright')) { moveX += 1; p.facing = 'right'; }

            const speed = 140; // Pixels per second (responsive fluid walk)

            if (moveX !== 0 || moveY !== 0) {
              // Diagonal vector normalization
              const len = Math.hypot(moveX, moveY);
              p.x += (moveX / len) * speed * dt;
              p.y += (moveY / len) * speed * dt;
              p.isWalking = true;
              p.walkCycle += dt * 8; // Smooth 8 steps/second cycle

              // Spawn footstep dust particles
              if (Math.random() < 0.25) {
                dustParticlesRef.current.push({
                  x: p.x + 12 + (Math.random() * 4 - 2),
                  y: p.y + 26,
                  vx: (Math.random() - 0.5) * 8,
                  vy: -Math.random() * 6 - 2,
                  life: 1.0
                });
              }

              // Play soft footstep tone
              audio.step();
            } else if (p.targetX !== null && p.targetY !== null) {
              // Click-to-move smooth pathing
              const dx = p.targetX - p.x;
              const dy = p.targetY - p.y;
              const dist = Math.hypot(dx, dy);

              if (dist > 3) {
                p.x += (dx / dist) * speed * dt;
                p.y += (dy / dist) * speed * dt;
                p.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
                p.isWalking = true;
                p.walkCycle += dt * 8;
                audio.step();

                if (Math.random() < 0.25) {
                  dustParticlesRef.current.push({
                    x: p.x + 12 + (Math.random() * 4 - 2),
                    y: p.y + 26,
                    vx: (Math.random() - 0.5) * 8,
                    vy: -Math.random() * 6 - 2,
                    life: 1.0
                  });
                }
              } else {
                p.targetX = null;
                p.targetY = null;
                p.isWalking = false;
                targetCursorRef.current = null;
              }
            } else {
              p.isWalking = false;
            }

            // Boundary collision
            p.x = Math.max(TILE_SIZE, Math.min((MAP_WIDTH - 2) * TILE_SIZE, p.x));
            p.y = Math.max(TILE_SIZE, Math.min((MAP_HEIGHT - 2) * TILE_SIZE, p.y));

            // Update dust particles
            dustParticlesRef.current = dustParticlesRef.current.filter(part => {
              part.x += part.vx * dt;
              part.y += part.vy * dt;
              part.life -= dt * 2.8;
              return part.life > 0;
            });

            // Proximity Detection for Interaction
            if (caseData && caseData.suspects) {
              const playerTileX = p.x / TILE_SIZE;
              const playerTileY = p.y / TILE_SIZE;
              let found = null;

              for (const s of caseData.suspects) {
                const dist = Math.hypot(s.mapX - playerTileX, s.mapY - playerTileY);
                if (dist <= 2.2) {
                  found = { type: 'suspect', data: s, label: `[E] TALK TO ${s.name.toUpperCase()}` };
                  break;
                }
              }

              if (!found) {
                for (const node of INTERACTIVE_NODES) {
                  const dist = Math.hypot(node.tileX - playerTileX, node.tileY - playerTileY);
                  if (dist <= 2.2) {
                    found = { type: 'node', data: node, label: node.label };
                    break;
                  }
                }
              }
              setInteractTarget(found);
            }

            // 2. CANVAS DRAWING
            if (canvas && caseData) {
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height);

              // Draw Tilemap
              drawWorldTilemap(ctx, canvas.width, canvas.height, currentTime);

              // Draw Target Cursor (Click-to-move golden ripple)
              if (targetCursorRef.current) {
                const tc = targetCursorRef.current;
                const age = (currentTime - tc.spawnTime) / 1000;
                const ringSize = (age * 16) % 18 + 4;
                ctx.strokeStyle = "rgba(227, 179, 65, 0.8)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(tc.x + 12, tc.y + 12, ringSize, 0, Math.PI * 2);
                ctx.stroke();
              }

              // Draw Dust Particles under feet
              dustParticlesRef.current.forEach(part => {
                ctx.fillStyle = `rgba(203, 213, 225, ${part.life * 0.4})`;
                ctx.fillRect(Math.floor(part.x), Math.floor(part.y), 3, 3);
              });

              // Interactive Nodes with smooth pulsing rings
              INTERACTIVE_NODES.forEach(node => {
                const nx = node.tileX * TILE_SIZE;
                const ny = node.tileY * TILE_SIZE;
                const pulse = Math.sin(currentTime / 300) * 3 + 12;

                ctx.fillStyle = "rgba(88, 166, 255, 0.2)";
                ctx.beginPath();
                ctx.arc(nx + 12, ny + 12, pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "14px monospace";
                ctx.fillText(node.icon, nx + 4, ny + 16);
              });

              // Draw Suspect NPCs (With subtle breathing and floating indicators)
              if (caseData.suspects) {
                caseData.suspects.forEach((s, idx) => {
                  const sx = (s.mapX !== undefined ? s.mapX : 10) * TILE_SIZE;
                  const sy = (s.mapY !== undefined ? s.mapY : 10) * TILE_SIZE;
                  const theme = s.spriteTheme || SPRITE_THEMES[idx % SPRITE_THEMES.length];
                  drawPixelChibiCharacter(ctx, sx, sy, theme, 'down', 0, false);

                  // Name Tag
                  ctx.font = "bold 8px monospace";
                  ctx.fillStyle = "#FFFFFF";
                  ctx.fillText(s.name.split(" ")[0], sx - 2, sy - 4);
                });
              }

              // Draw Radar Beacon Ping if active
              if (radarBeacon) {
                const rx = radarBeacon.x * TILE_SIZE + 12;
                const ry = radarBeacon.y * TILE_SIZE + 12;
                const pulse = (Math.sin(currentTime / 180) + 1) * 14 + 10;
                ctx.strokeStyle = "#F43F5E";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(rx, ry, pulse, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = "#EF4444";
                ctx.font = "bold 9px 'Press Start 2P', monospace";
                ctx.fillText("BEACON DETECTED!", rx - 60, ry - 22);
              }

              // Draw Player Detective (With fluid 4-phase walk cycle!)
              drawPixelChibiCharacter(
                ctx,
                p.x,
                p.y,
                DETECTIVE_THEME,
                p.facing,
                p.walkCycle,
                p.isWalking
              );

              // Floating Interactive Dialogue Indicator (Smooth springy bob)
              if (interactTarget) {
                const ix = p.x + 12;
                const bob = Math.sin(currentTime / 220) * 3;
                const iy = p.y - 14 + bob;

                ctx.fillStyle = "rgba(13, 17, 23, 0.9)";
                ctx.strokeStyle = "#E3B341";
                ctx.lineWidth = 1;
                const text = interactTarget.label;
                ctx.font = "bold 9px monospace";
                const tw = ctx.measureText(text).width;
                ctx.fillRect(ix - tw / 2 - 4, iy - 16, tw + 8, 15);
                ctx.strokeRect(ix - tw / 2 - 4, iy - 16, tw + 8, 15);
                ctx.fillStyle = "#58A6FF";
                ctx.fillText(text, ix - tw / 2, iy - 5);
              }
            }
          } catch (err) {
            console.error("Game loop caught:", err);
          }

          animId = requestAnimationFrame(gameLoop);
        };

        animId = requestAnimationFrame(gameLoop);
        return () => cancelAnimationFrame(animId);
      }, [caseData, radarBeacon]);

      // SMOOTH CLICK-TO-MOVE (Walks towards clicked target instead of snapping!)
      const handleCanvasClick = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * (MAP_WIDTH * TILE_SIZE);
        const clickY = ((e.clientY - rect.top) / rect.height) * (MAP_HEIGHT * TILE_SIZE);

        // Set target destination
        playerRef.current.targetX = clickX - 12;
        playerRef.current.targetY = clickY - 14;

        // Spawn target cursor ripple
        targetCursorRef.current = {
          x: clickX - 12,
          y: clickY - 14,
          spawnTime: performance.now()
        };

        audio.click();
      };

      if (bossMode) {
        return (
          <div className="min-h-screen bg-[#111827] text-slate-300 font-sans p-6 select-text">
            <div className="flex items-center justify-between pb-4 border-b border-slate-700 mb-6">
              <span className="font-bold text-white text-base">Grafana Cloud // Cluster Ingress Latency (p99: 14.2ms)</span>
              <button onClick={() => setBossMode(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded text-xs">
                [Esc] Return
              </button>
            </div>
            <div className="h-44 bg-slate-950 rounded flex items-center justify-center text-xs text-slate-500 font-mono">
              [ALL 64 CLUSTER PODS OPERATIONAL]
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen flex flex-col font-mono ${shakeScreen ? 'shake-effect' : ''}`}>
          <div className="fixed inset-0 scanlines z-40 pointer-events-none opacity-25"></div>

          {toastMsg && (
            <div className="fixed top-4 right-4 z-50 bg-[#161B22] border-2 border-cyan-400 text-cyan-300 px-4 py-2 rounded shadow-2xl text-xs">
              {toastMsg}
            </div>
          )}

          {/* HEADER */}
          <header className="bg-[#161B22] border-b-2 border-[#30363D] px-4 py-2 flex items-center justify-between text-xs sticky top-0 z-30">
            <div className="flex items-center gap-3">
              <span className="text-lg">🕵️</span>
              <span className="font-bold text-white text-sm">THE COLD FILE // 2D DETECTIVE</span>
              <span className="bg-[#0D1117] text-cyan-400 px-2 py-0.5 rounded border border-[#30363D]">
                {caseData.caseId}
              </span>
            </div>

            <div className="flex items-center gap-3">
              <div className="flex border border-[#30363D] rounded overflow-hidden">
                <button
                  onClick={() => { setViewMode('map'); audio.click(); }}
                  className={`px-3 py-1 font-bold text-xs transition ${viewMode === 'map' ? 'bg-cyan-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}
                >
                  🎮 2D MAP
                </button>
                <button
                  onClick={() => { setViewMode('terminal'); audio.click(); }}
                  className={`px-3 py-1 font-bold text-xs transition ${viewMode === 'terminal' ? 'bg-cyan-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}
                >
                  🖥️ LOGS
                </button>
              </div>

              <button
                onClick={() => { const next = !soundMuted; setSoundMuted(next); audio.muted = next; }}
                className="px-2 py-1 bg-[#0D1117] border border-[#30363D] rounded text-slate-300"
              >
                {soundMuted ? '🔇' : '🔊'}
              </button>

              <button
                onClick={() => { localStorage.clear(); window.location.reload(); }}
                className="px-2 py-1 bg-[#0D1117] hover:bg-rose-950 text-rose-400 border border-[#30363D] rounded text-[11px]"
                title="Reset Game Cache"
              >
                RESET
              </button>

              <button
                onClick={() => setBossMode(true)}
                className="px-2.5 py-1 bg-slate-800 text-slate-200 rounded border border-slate-600 text-xs"
              >
                [SYS_MODE] (ESC)
              </button>
            </div>
          </header>

          {/* BRIEFING */}
          <div className="bg-[#0D1117] border-b border-[#30363D] px-4 py-1.5 flex items-center justify-between text-xs">
            <div className="truncate">
              <strong className="text-rose-400">CRIME:</strong> <span className="text-white">{caseData.crime.title}</span>
            </div>
            <div className="text-amber-400 font-bold shrink-0">AP: {ap}/{maxAp}</div>
          </div>

          {/* MAIN */}
          <main className="flex-1 flex flex-col lg:flex-row p-3 gap-3 max-w-[1700px] w-full mx-auto">
            {viewMode === 'map' ? (
              <div className="flex-1 flex flex-col lg:flex-row gap-3">
                <div className="flex-1 bg-[#0D1117] border-2 border-[#30363D] rounded-lg p-2 flex flex-col items-center justify-center relative shadow-2xl">
                  <div className="w-full flex justify-between items-center text-xs text-slate-400 px-2 py-1 border-b border-[#30363D] mb-2 font-retro text-[9px]">
                    <span className="text-cyan-400">SMOOTH MOVE: HOLD [WASD] or CLICK ANYWHERE TO WALK</span>
                    <span className="text-amber-400">ACTION: [E] or [SPACE]</span>
                  </div>
                  <canvas
                    ref={canvasRef}
                    width={MAP_WIDTH * TILE_SIZE}
                    height={MAP_HEIGHT * TILE_SIZE}
                    onClick={handleCanvasClick}
                    className="border border-[#30363D] rounded bg-black cursor-pointer max-w-full h-auto"
                    style={{ maxHeight: '660px' }}
                  />
                </div>

                {/* Sidebar */}
                <div className="w-full lg:w-80 flex flex-col gap-3">
                  <div className="bg-[#161B22] border-2 border-[#30363D] rounded-lg p-3">
                    <div className="flex justify-between items-center text-xs mb-2">
                      <span className="font-bold text-cyan-400">ACTION POINTS</span>
                      <span className="text-amber-400 font-bold">Streak: {career.streak}</span>
                    </div>
                    <div className="grid grid-cols-8 gap-1">
                      {Array.from({ length: maxAp }).map((_, i) => (
                        <div key={i} className={`h-3 rounded-sm border ${i < ap ? 'bg-cyan-400 border-cyan-200' : 'bg-black border-[#30363D] opacity-30'}`} />
                      ))}
                    </div>
                  </div>

                  <div className="bg-[#161B22] border-2 border-[#30363D] rounded-lg p-3 flex-1 flex flex-col">
                    <span className="text-xs font-bold text-white mb-2 block">CAMPUS SUSPECTS</span>
                    <div className="space-y-2 flex-1 overflow-y-auto max-h-[380px]">
                      {caseData.suspects.map(s => (
                        <div
                          key={s.id}
                          onClick={() => { setActiveSuspectModal(s); audio.click(); }}
                          className="p-2 bg-[#0D1117] border border-[#30363D] hover:border-cyan-400 rounded cursor-pointer transition flex items-center justify-between"
                        >
                          <div>
                            <div className="font-bold text-white text-xs">{s.name}</div>
                            <div className="text-[10px] text-slate-400">{s.statedRoom}</div>
                          </div>
                          <span className="text-xs font-retro text-cyan-400">[INSPECT]</span>
                        </div>
                      ))}
                    </div>

                    <button
                      onClick={() => setAccusationModalOpen(true)}
                      className="mt-3 w-full py-2.5 bg-gradient-to-r from-rose-700 to-amber-700 hover:from-rose-600 hover:to-amber-600 text-white font-bold text-xs rounded border border-rose-400 shadow-lg tracking-wider"
                    >
                      ⚖️ LOCK IN ACCUSATION
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex-1 bg-[#161B22] border-2 border-[#30363D] rounded-lg p-4 flex flex-col shadow-2xl">
                <div className="flex items-center gap-2 pb-3 border-b border-[#30363D] mb-3 text-xs font-bold">
                  <button onClick={() => setActiveTab('badge')} className={`px-3 py-1.5 rounded ${activeTab === 'badge' ? 'bg-cyan-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}>
                    💳 KEYCARDS ({caseData.evidence.badgeLogs.length})
                  </button>
                  <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded ${activeTab === 'chat' ? 'bg-amber-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}>
                    💬 CHATS ({caseData.evidence.chatLogs.length})
                  </button>
                  <button onClick={() => setActiveTab('network')} className={`px-3 py-1.5 rounded ${activeTab === 'network' ? 'bg-emerald-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}>
                    🌐 NETWORK ({caseData.evidence.networkLogs.length})
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 text-xs">
                  {caseData.evidence[`${activeTab}Logs`].map(item => (
                    <div key={item.id} className="p-3 bg-[#0D1117] border border-[#30363D] rounded">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-cyan-400 font-bold">[{item.timestamp}] {item.holderName || item.sender || item.source}</span>
                        <span className="text-slate-400">{item.location || item.channel || item.protocol}</span>
                      </div>
                      <p className="text-slate-300 text-[11px]">{item.details || item.message}</p>
                      {item.contradiction && (
                        <div className="mt-1 text-rose-400 font-bold text-[10px]">CONTRADICTION: {item.contradiction}</div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* SUSPECT MODAL */}
          {activeSuspectModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#161B22] border-2 border-cyan-400 rounded-lg max-w-lg w-full p-5 shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b border-[#30363D] mb-3">
                  <span className="font-bold text-white text-sm">{activeSuspectModal.name}</span>
                  <button onClick={() => setActiveSuspectModal(null)} className="text-slate-400 hover:text-white">[CLOSE]</button>
                </div>
                <div className="bg-[#0D1117] p-3 rounded border border-[#30363D] text-xs mb-4">
                  <span className="text-amber-400 block font-bold mb-1">STATED ALIBI:</span>
                  <p className="text-slate-200">{activeSuspectModal.statedAlibi}</p>
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  <button
                    onClick={() => {
                      if (!spendAP(1)) return;
                      audio.scan();
                      setActiveSuspectModal(null);
                      const isMatch = activeSuspectModal.actualRoom === activeSuspectModal.statedRoom;
                      const target = isMatch ? { x: activeSuspectModal.mapX, y: activeSuspectModal.mapY } : { x: RESTRICTED_ROOM.tileX, y: RESTRICTED_ROOM.tileY };
                      setRadarBeacon(target);
                      showToast(isMatch ? `✓ SIGNAL: Confirmed in ${activeSuspectModal.statedRoom}` : `🚨 CONTRADICTION: Signal detected in ${RESTRICTED_ROOM.name}!`);
                    }}
                    className="p-2.5 bg-cyan-950 hover:bg-cyan-900 border border-cyan-500 text-cyan-300 rounded font-bold"
                  >
                    📡 SIGNAL TRACKER (1 AP)
                  </button>
                  <button
                    onClick={() => {
                      if (!spendAP(1)) return;
                      const resp = activeSuspectModal.isCulprit ? caseData.crime.alibiSlipDialogue : "I was in my assigned room. Check my git commits!";
                      showToast(`🎙️ "${resp}"`);
                      audio.voiceBeep(450);
                    }}
                    className="p-2.5 bg-amber-950 hover:bg-amber-900 border border-amber-500 text-amber-300 rounded font-bold"
                  >
                    🎙️ INTERROGATE (1 AP)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ACCUSATION MODAL */}
          {accusationModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#161B22] border-2 border-rose-500 rounded-lg max-w-lg w-full p-6 shadow-2xl">
                {verdictData ? (
                  <div>
                    <h2 className="text-lg font-bold text-center mb-2 text-white">
                      {verdictData.isSuccess ? '🏆 GUILTY VERDICT CONFIRMED!' : '❌ WRONGFUL ACCUSATION!'}
                    </h2>
                    <p className="text-xs text-slate-300 mb-4 bg-[#0D1117] p-3 rounded border border-[#30363D]">
                      {verdictData.summary}
                    </p>
                    <button
                      onClick={() => { setAccusationModalOpen(false); setCaseData(generateCaseData(caseData.caseNumber + 1)); }}
                      className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-black font-bold rounded"
                    >
                      NEXT CASE ➔
                    </button>
                  </div>
                ) : (
                  <div>
                    <h2 className="text-sm font-bold text-white mb-3">LOCK IN ACCUSATION SHOWDOWN</h2>
                    <select
                      value={selectedAccusedSuspectId}
                      onChange={(e) => setSelectedAccusedSuspectId(e.target.value)}
                      className="w-full bg-[#0D1117] border border-[#30363D] rounded p-2 text-white text-xs mb-4"
                    >
                      <option value="">-- Choose suspect to indict --</option>
                      {caseData.suspects.map(s => (
                        <option key={s.id} value={s.id}>{s.name} ({s.role})</option>
                      ))}
                    </select>

                    <div className="flex justify-end gap-2 text-xs">
                      <button onClick={() => setAccusationModalOpen(false)} className="px-3 py-1.5 bg-[#0D1117] text-slate-300 rounded">
                        CANCEL
                      </button>
                      <button
                        onClick={() => {
                          const accused = caseData.suspects.find(s => s.id === selectedAccusedSuspectId);
                          if (!accused) return;
                          if (accused.isCulprit) {
                            audio.success();
                            setVerdictData({ isSuccess: true, summary: `Case solved! ${accused.name} was arrested. Motive: ${accused.motive}` });
                            setCareer(prev => ({ ...prev, streak: prev.streak + 1 }));
                          } else {
                            audio.failure();
                            setVerdictData({ isSuccess: false, summary: `Wrongful accusation! Real culprit was ${caseData.culpritName}!` });
                            setCareer(prev => ({ ...prev, streak: 0 }));
                          }
                        }}
                        className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded"
                      >
                        INDICT TARGET ➔
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          <footer className="bg-[#161B22] border-t border-[#30363D] px-4 py-2 flex items-center justify-between text-[11px] text-slate-400">
            <span>THE COLD FILE // 2D PIXEL EDITION</span>
            <span>PRESS [ESC] FOR STEALTH BOSS MODE</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
