    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.04) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      step() {
        this.playTone(180, 'triangle', 0.03, 0.015);
      }

      interact() {
        this.playTone(920, 'square', 0.06, 0.03);
      }

      click() {
        this.playTone(1800, 'triangle', 0.03, 0.03);
      }

      scan() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1400, this.ctx.currentTime + 0.28);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.29);
        } catch (e) {}
      }

      decrypt() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [750, 1150, 1450, 950, 1650].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, now + idx * 0.04);
            gain.gain.setValueAtTime(0.02, now + idx * 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.04 + 0.035);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.04);
            osc.stop(now + idx * 0.04 + 0.04);
          });
        } catch (e) {}
      }

      alert() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [440, 880, 440, 880].forEach((freq, idx) => {

            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.05, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.085);
          });

        if (this.muted) return;
        this.init();

            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.3);
          });
        } catch (e) {}

            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.14);
            osc.stop(now + idx * 0.14 + 0.22);

          networkLogs: networkLogs.sort((a, b) => a.timestamp.localeCompare(b.timestamp))
        }
      };
    }

    // ==========================================
    // 4. PROCEDURAL 2D PIXEL SPRITE RENDERER
    // (Directly implements the chibi pixel style of user's reference)
    // ==========================================
    function drawPixelChibiCharacter(ctx, x, y, theme, facing = 'down', frame = 0, isWalking = false) {
      ctx.save();
      ctx.translate(Math.floor(x), Math.floor(y));

      const bobY = isWalking ? (frame % 2 === 0 ? -1 : 1) : Math.sin(Date.now() / 320) * 0.8;
      const legOffset = isWalking ? (frame % 2 === 0 ? 2 : -2) : 0;

      // Draw drop shadow
      ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
      ctx.beginPath();
      ctx.ellipse(12, 29, 9, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Outline helper
      const p = (px, py, w, h, color) => {
        ctx.fillStyle = color;
        ctx.fillRect(px, py + bobY, w, h);
      };

      // 1. LEGS & BOOTS (Styled fold-over boots with gold button like reference 1)
      // Left Leg
      p(6 - legOffset, 20, 4, 7, theme.pants);
      p(5 - legOffset, 22, 5, 6, theme.boots);
      p(5 - legOffset, 21, 5, 2, theme.bootCuffs); // Fold-over boot cuff
      p(6 - legOffset, 24, 1, 2, theme.cuffGold); // Gold boot button!

      // Right Leg
      p(14 + legOffset, 20, 4, 7, theme.pants);
      p(14 + legOffset, 22, 5, 6, theme.boots);
      p(14 + legOffset, 21, 5, 2, theme.bootCuffs);
      p(15 + legOffset, 24, 1, 2, theme.cuffGold);

      // 2. TORSO, WAISTCOAT & WHITE PUFFY SLEEVES (Matching Reference 1)
      // White shirt under-layer
      p(7, 13, 10, 8, theme.shirt);

      // Tailored Vest / Waistcoat
      p(8, 14, 8, 7, theme.vest);
      p(8, 17, 8, 4, theme.vestShadow);
      // Gold Vest Buttons down the center
      p(11, 15, 2, 1, theme.cuffGold);
      p(11, 17, 2, 1, theme.cuffGold);
      p(11, 19, 2, 1, theme.cuffGold);

      // Sleeves & Dark Gloves
      // Left arm
      p(4, 14, 3, 5, theme.shirt);
      p(4, 18, 3, 3, theme.gloves);
      p(4, 17, 3, 1, theme.cuffGold); // Gold cuff rim

      // Right arm
      p(17, 14, 3, 5, theme.shirt);
      p(17, 18, 3, 3, theme.gloves);
      p(17, 17, 3, 1, theme.cuffGold);

      // 3. HEAD & FACE
      // Neck
      p(10, 11, 4, 2, theme.skinShadow);
      // Face base
      p(6, 6, 12, 6, theme.skin);
      p(5, 7, 1, 4, theme.skin); // Ears
      p(18, 7, 1, 4, theme.skin);

      // Cute Eyes (2x3 pixel with white shine highlight, like reference 1!)
      if (facing !== 'up') {
        const eyeOffset = facing === 'left' ? -1 : facing === 'right' ? 1 : 0;
        // Left Eye
        p(8 + eyeOffset, 8, 2, 3, theme.eye);
        p(8 + eyeOffset, 8, 1, 1, "#FFFFFF"); // White shine pupil

        // Right Eye
        p(14 + eyeOffset, 8, 2, 3, theme.eye);
        p(14 + eyeOffset, 8, 1, 1, "#FFFFFF");

        // Soft blush
        p(7 + eyeOffset, 10, 1, 1, "#F472B6");
        p(16 + eyeOffset, 10, 1, 1, "#F472B6");
      }

      // 4. BIG FLUFFY ANIME HAIR (Layered bangs and side tufts from reference 1)
      // Hair Back volume
      p(4, 3, 16, 5, theme.hair);
      p(3, 5, 2, 5, theme.hair);
      p(19, 5, 2, 5, theme.hair);

      // Front Bangs & Side Tufts
      p(5, 4, 14, 3, theme.hair);
      p(6, 7, 3, 2, theme.hair);
      p(11, 7, 2, 2, theme.hair);
      p(15, 7, 3, 2, theme.hair);

      // Side tufts angled outward (Signature chibi anime silhouette from Reference 1)
      p(2, 6, 3, 3, theme.hair);
      p(1, 8, 2, 3, theme.hairShadow);
      p(19, 6, 3, 3, theme.hair);
      p(21, 8, 2, 3, theme.hairShadow);

      // Hair shading & highlights
      p(7, 3, 10, 1, "#FFFFFF");
      p(4, 7, 2, 2, theme.hairShadow);
      p(18, 7, 2, 2, theme.hairShadow);

      ctx.restore();
    }

    // ==========================================
    // 5. 2D TILEMAP & WORLD ENGINE
    // ==========================================
    const MAP_WIDTH = 30;
    const MAP_HEIGHT = 22;
    const TILE_SIZE = 24;

    // Interactive Terminals on the map
    const INTERACTIVE_NODES = [
      { id: "node_badge", name: "Keycard Security Gate", tileX: 15, tileY: 5, type: "badge", label: "[E] SWIPE LOGS", icon: "💳" },
      { id: "node_chat", name: "SecOps Chat Terminal", tileX: 13, tileY: 15, type: "chat", label: "[E] CHAT RELAY", icon: "💬" },
      { id: "node_net", name: "Core Network Rack", tileX: 17, tileY: 15, type: "network", label: "[E] PCAP TRACE", icon: "🌐" },
      { id: "node_pinboard", name: "Deduction Whiteboard", tileX: 15, tileY: 18, type: "notes", label: "[E] CASE NOTES", icon: "📌" },
      { id: "node_crime_tape", name: "Breached Vault Safe", tileX: 7, tileY: 4, type: "crime_scene", label: "[E] CRIME SCENE", icon: "🚨" }
    ];

    function drawWorldTilemap(ctx, width, height, time) {
      // 1. Base floor tiles (Dark corporate grid / pastel office tiles)
      for (let y = 0; y < MAP_HEIGHT; y++) {
        for (let x = 0; x < MAP_WIDTH; x++) {
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;

          // Outer walls
          if (x === 0 || y === 0 || x === MAP_WIDTH - 1 || y === MAP_HEIGHT - 1) {
            ctx.fillStyle = "#161B22";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#30363D";
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
            continue;
          }

          // Interior Rooms
          // Top Left: Restricted Server Vault (Crime Scene!)
          if (x < 13 && y < 10) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#0D1117" : "#161B22";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            // Red danger floor line
            if (x === 12 || y === 9) {
              ctx.fillStyle = "#991B1B";
              ctx.fillRect(px, py, TILE_SIZE, 3);
            }
          }
          // Top Right: Conference Room 4A
          else if (x > 17 && y < 10) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#1C2430" : "#242E3D"; // Polished parquet
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#2E3B4E";
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
          }
          // Bottom Left: Cafeteria & Breakroom
          else if (x < 13 && y > 12) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#13233A" : "#1B2A4A"; // Checkerboard
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          }
          // Bottom Right: Executive 7th Floor Lounge
          else if (x > 17 && y > 12) {
            ctx.fillStyle = (x + y) % 2 === 0 ? "#2B1724" : "#381E2F"; // Velvet burgundy
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
          }
          // Central Hallways & Security Corridor
          else {
            ctx.fillStyle = "#111827";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#1F2937";
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // 2. Interior Walls & Glass Partitions
      ctx.fillStyle = "#30363D";
      // Vertical divider top
      ctx.fillRect(13 * TILE_SIZE, 1 * TILE_SIZE, 4, 8 * TILE_SIZE);
      ctx.fillRect(17 * TILE_SIZE, 1 * TILE_SIZE, 4, 8 * TILE_SIZE);
      // Vertical divider bottom
      ctx.fillRect(13 * TILE_SIZE, 13 * TILE_SIZE, 4, 8 * TILE_SIZE);
      ctx.fillRect(17 * TILE_SIZE, 13 * TILE_SIZE, 4, 8 * TILE_SIZE);
      // Horizontal dividers
      ctx.fillRect(1 * TILE_SIZE, 9 * TILE_SIZE, 12 * TILE_SIZE, 4);
      ctx.fillRect(18 * TILE_SIZE, 9 * TILE_SIZE, 11 * TILE_SIZE, 4);
      ctx.fillRect(1 * TILE_SIZE, 13 * TILE_SIZE, 12 * TILE_SIZE, 4);
      ctx.fillRect(18 * TILE_SIZE, 13 * TILE_SIZE, 11 * TILE_SIZE, 4);

      // 3. Furniture & Props (Sprout Lands inspired corporate style)
      // A) Conference Room 4A Table
      ctx.fillStyle = "#78350F";
      ctx.fillRect(20 * TILE_SIZE, 4 * TILE_SIZE, 7 * TILE_SIZE, 3 * TILE_SIZE);
      ctx.fillStyle = "#92400E";
      ctx.fillRect(20 * TILE_SIZE + 2, 4 * TILE_SIZE + 2, 7 * TILE_SIZE - 4, 3 * TILE_SIZE - 4);
      // Laptops on table
      ctx.fillStyle = "#94A3B8";
      ctx.fillRect(21 * TILE_SIZE, 5 * TILE_SIZE, 12, 10);
      ctx.fillRect(24 * TILE_SIZE, 5 * TILE_SIZE, 12, 10);
      ctx.fillRect(26 * TILE_SIZE, 5 * TILE_SIZE, 12, 10);

      // B) Server Vault Racks (Blinking LEDs)
      for (let r = 0; r < 4; r++) {
        const rx = (3 + r * 2.5) * TILE_SIZE;
        const ry = 3 * TILE_SIZE;
        ctx.fillStyle = "#0F172A";
        ctx.fillRect(rx, ry, 36, 60);
        ctx.strokeStyle = "#334155";
        ctx.strokeRect(rx, ry, 36, 60);
        // Blinking LEDs
        const blink1 = Math.floor(time / 200 + r) % 2 === 0;
        const blink2 = Math.floor(time / 350 + r) % 2 === 0;
        ctx.fillStyle = blink1 ? "#22C55E" : "#15803D";
        ctx.fillRect(rx + 6, ry + 10, 4, 4);
        ctx.fillStyle = blink2 ? "#EF4444" : "#991B1B";
        ctx.fillRect(rx + 14, ry + 10, 4, 4);
        ctx.fillStyle = "#38BDF8";
        ctx.fillRect(rx + 22, ry + 10, 4, 4);
      }

      // Yellow Crime Scene Tape at Vault entrance
      ctx.fillStyle = "#EAB308";
      ctx.fillRect(10 * TILE_SIZE, 9 * TILE_SIZE - 2, 3 * TILE_SIZE, 4);
      ctx.fillStyle = "#000000";
      for (let s = 0; s < 5; s++) {
        ctx.fillRect(10 * TILE_SIZE + s * 14, 9 * TILE_SIZE - 2, 6, 4);
      }

      // C) Cafeteria Tables & Coffee Machine
      ctx.fillStyle = "#334155";
      ctx.fillRect(4 * TILE_SIZE, 15 * TILE_SIZE, 4 * TILE_SIZE, 2 * TILE_SIZE);
      ctx.fillRect(4 * TILE_SIZE, 18 * TILE_SIZE, 4 * TILE_SIZE, 2 * TILE_SIZE);
      // Vending Machine
      ctx.fillStyle = "#1E293B";
      ctx.fillRect(2 * TILE_SIZE, 14 * TILE_SIZE, 24, 40);
      ctx.fillStyle = "#06B6D4";
      ctx.fillRect(2 * TILE_SIZE + 4, 14 * TILE_SIZE + 6, 16, 18);

      // D) Executive Lounge Couches & Ficus Plants
      ctx.fillStyle = "#991B1B";
      ctx.fillRect(20 * TILE_SIZE, 15 * TILE_SIZE, 6 * TILE_SIZE, 20);
      ctx.fillRect(20 * TILE_SIZE, 18 * TILE_SIZE, 6 * TILE_SIZE, 20);
      // Potted plants (Sprout Lands style)
      [ {x: 19, y: 14}, {x: 27, y: 14}, {x: 19, y: 19}, {x: 27, y: 19} ].forEach(p => {
        ctx.fillStyle = "#78350F";
        ctx.fillRect(p.x * TILE_SIZE + 4, p.y * TILE_SIZE + 10, 16, 14);
        ctx.fillStyle = "#22C55E";
        ctx.beginPath();
        ctx.arc(p.x * TILE_SIZE + 12, p.y * TILE_SIZE + 8, 10, 0, Math.PI * 2);
        ctx.fill();
      });

      // 4. Room Label Banners
      ctx.font = "bold 9px 'Press Start 2P', monospace";
      ctx.fillStyle = "#EF4444";
      ctx.fillText("RESTRICTED SERVER VAULT", 2 * TILE_SIZE, 2.2 * TILE_SIZE);
      ctx.fillStyle = "#38BDF8";
      ctx.fillText("CONFERENCE ROOM 4A", 19 * TILE_SIZE, 2.2 * TILE_SIZE);
      ctx.fillStyle = "#10B981";
      ctx.fillText("CAFETERIA & BREAKROOM", 2 * TILE_SIZE, 13.8 * TILE_SIZE);
      ctx.fillStyle = "#F43F5E";
      ctx.fillText("EXECUTIVE LOUNGE", 19 * TILE_SIZE, 13.8 * TILE_SIZE);
      ctx.fillStyle = "#A78BFA";
      ctx.fillText("CENTRAL SECURITY CORRIDOR", 8 * TILE_SIZE, 11 * TILE_SIZE);
    }

    // ==========================================
    // 6. MAIN APPLICATION COMPONENT
    // ==========================================
    function App() {
      // Game State
      const [caseData, setCaseData] = useState(null);
      const [ap, setAp] = useState(8);
      const [maxAp, setMaxAp] = useState(8);
      const [viewMode, setViewMode] = useState('map'); // 'map' (2D pixel view) or 'terminal' (forensic console)
      const [activeTab, setActiveTab] = useState('badge');
      const [pinnedLogIds, setPinnedLogIds] = useState([]);
      const [playerNotes, setPlayerNotes] = useState('');

      // Player Position on 2D Tilemap
      const [playerPos, setPlayerPos] = useState({ x: 15, y: 10, facing: 'down', isWalking: false });
      const [interactTarget, setInteractTarget] = useState(null); // active NPC or Node near player

      // Radar Gadget visual ping on 2D map
      const [radarBeacon, setRadarBeacon] = useState(null); // { x, y, roomName, color }

      // Modals
      const [activeSuspectModal, setActiveSuspectModal] = useState(null);
      const [activeNodeModal, setActiveNodeModal] = useState(null);
      const [activeGadgetModal, setActiveGadgetModal] = useState(null);
      const [trackerResult, setTrackerResult] = useState(null);
      const [interrogationDialogue, setInterrogationDialogue] = useState(null);
      const [decryptingLog, setDecryptingLog] = useState(null);
      const [decryptStep, setDecryptStep] = useState(0);

      // Live Leaks & Accusation
      const [liveLeakModal, setLiveLeakModal] = useState(null);
      const [apSpentCounter, setApSpentCounter] = useState(0);
      const [shakeScreen, setShakeScreen] = useState(false);
      const [accusationModalOpen, setAccusationModalOpen] = useState(false);
      const [selectedAccusedSuspectId, setSelectedAccusedSuspectId] = useState('');
      const [selectedEvidence1, setSelectedEvidence1] = useState('');
      const [selectedEvidence2, setSelectedEvidence2] = useState('');
      const [verdictData, setVerdictData] = useState(null);
      const [verifyingStage, setVerifyingStage] = useState(0);

      // Career Stats & Tech Lab
      const [career, setCareer] = useState({
        xp: 150,
        level: 1,
        rankTitle: "Junior Forensic Analyst",
        creds: 250,
        casesSolved: 0,
        streak: 0,
        upgrades: { extraApBattery: false, quantumDecryptor: false, forensicCache: false }
      });
      const [techLabOpen, setTechLabOpen] = useState(false);

      // Meta & Boss Key
      const [bossMode, setBossMode] = useState(false);
      const [soundMuted, setSoundMuted] = useState(false);
      const [tutorialActive, setTutorialActive] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      const canvasRef = useRef(null);

      // ==========================================
      // INITIALIZATION
      // ==========================================
      useEffect(() => {
        const saved = localStorage.getItem('THE_COLD_FILE_STATE_V1');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            setCaseData(parsed.caseData);
            setAp(parsed.ap !== undefined ? parsed.ap : 8);
            setMaxAp(parsed.maxAp || 8);
            setPinnedLogIds(parsed.pinnedLogIds || []);
            setPlayerNotes(parsed.playerNotes || '');
            setCareer(parsed.career || career);
            setSoundMuted(!!parsed.soundMuted);
            audio.muted = !!parsed.soundMuted;
          } catch (e) {
            startNewCase(1);
          }
        } else {
          startNewCase(1);
          setTutorialActive(true);
        }

        // Global Boss Key (Escape) & WASD Movement
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setBossMode(prev => !prev);
            return;
          }

          // If a modal is open, don't move
          if (activeSuspectModal || activeNodeModal || activeGadgetModal || liveLeakModal || accusationModalOpen || techLabOpen || tutorialActive) {
            return;
          }

          // WASD / Arrow Movement
          let dx = 0;
          let dy = 0;
          let newFacing = playerPos.facing;

          if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { dy = -1; newFacing = 'up'; }
          else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') { dy = 1; newFacing = 'down'; }
          else if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') { dx = -1; newFacing = 'left'; }
          else if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') { dx = 1; newFacing = 'right'; }
          else if (e.key === 'e' || e.key === 'E' || e.key === ' ') {
            // Trigger interaction
            triggerNearbyInteraction();
            return;
          }

          if (dx !== 0 || dy !== 0) {
            e.preventDefault();
            setPlayerPos(prev => {
              const nx = Math.max(1, Math.min(MAP_WIDTH - 2, prev.x + dx));
              const ny = Math.max(1, Math.min(MAP_HEIGHT - 2, prev.y + dy));
              audio.step();
              return { x: nx, y: ny, facing: newFacing, isWalking: true };
            });
            setTimeout(() => setPlayerPos(prev => ({ ...prev, isWalking: false })), 160);
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [activeSuspectModal, activeNodeModal, activeGadgetModal, liveLeakModal, accusationModalOpen, techLabOpen, tutorialActive, playerPos]);

      // Check proximity to suspects & nodes whenever player moves
      useEffect(() => {
        if (!caseData) return;
        // Check suspects
        let found = null;
        for (const s of caseData.suspects) {
          const dist = Math.hypot(s.mapX - playerPos.x, s.mapY - playerPos.y);
          if (dist <= 2.2) {
            found = { type: 'suspect', data: s, label: `[E] TALK TO ${s.name.toUpperCase()}` };
            break;
          }
        }
        if (!found) {
          // Check interactive nodes
          for (const node of INTERACTIVE_NODES) {
            const dist = Math.hypot(node.tileX - playerPos.x, node.tileY - playerPos.y);
            if (dist <= 2.2) {
              found = { type: 'node', data: node, label: node.label };
              break;
            }
          }
        }
        setInteractTarget(found);
      }, [playerPos, caseData]);

      // Auto-save
      useEffect(() => {
        if (!caseData) return;
        localStorage.setItem('THE_COLD_FILE_STATE_V1', JSON.stringify({
          caseData, ap, maxAp, pinnedLogIds, playerNotes, career, soundMuted
        }));
      }, [caseData, ap, maxAp, pinnedLogIds, playerNotes, career, soundMuted]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const startNewCase = (caseNum) => {
        const fresh = generateCaseData(caseNum || (caseData ? caseData.caseNumber + 1 : 1));
        const initialMaxAp = career.upgrades.extraApBattery ? 10 : 8;
        setCaseData(fresh);
        setAp(initialMaxAp);
        setMaxAp(initialMaxAp);
        setPinnedLogIds([]);
        setPlayerNotes(`CASE FILE: ${fresh.caseId}\nCRIME: ${fresh.crime.title}\nINCIDENT WINDOW: ${fresh.crime.criticalWindow}\nASSET: ${fresh.crime.compromisedAsset}\n---\n`);
        setPlayerPos({ x: 15, y: 10, facing: 'down', isWalking: false });
        setVerdictData(null);
        setRadarBeacon(null);
        audio.scan();
        showToast(`📁 ${fresh.caseId} LOADED // MAP DEPLOYED`);
      };

      const spendAP = (cost, actionName) => {
        if (ap < cost) {
          audio.alert();
          showToast(`⚠️ INSUFFICIENT AP! (${cost} required, ${ap} remaining)`);
          return false;
        }
        const newAp = ap - cost;
        setAp(newAp);
        audio.click();

        const nextSpent = apSpentCounter + cost;
        setApSpentCounter(nextSpent);
        if (nextSpent >= 2) {
          triggerLiveLeak();
          setApSpentCounter(0);
        }
        return true;
      };

      const triggerLiveLeak = () => {
        setShakeScreen(true);
        audio.alert();
        setTimeout(() => setShakeScreen(false), 450);

        setLiveLeakModal({
          title: "⚠️ SURPRISE INTERCEPT // LOG PURGE DETECTED",
          text: `Hostile shell script 'shred_vault_audit.sh' detected on Node 4! Suspect attempting to destroy evidence for ${caseData.crime.incidentTime}. Spend 1 AP to intercept and salvage the raw buffer, or let it burn?`,
          actionText: "INTERCEPT BUFFER (-1 AP)",
          onAction: () => {
            if (ap >= 1) {
              setAp(prev => prev - 1);
              showToast(`🚨 RECOVERED SMOKING GUN: Badge Swipe to ${RESTRICTED_ROOM.name}!`);
              setLiveLeakModal(null);
              setActiveTab('badge');
              audio.success();
            }
          }
        });
      };

      const triggerNearbyInteraction = () => {
        if (!interactTarget) return;
        audio.interact();

        if (interactTarget.type === 'suspect') {
          setActiveSuspectModal(interactTarget.data);
        } else if (interactTarget.type === 'node') {
          const node = interactTarget.data;
          if (node.type === 'crime_scene') {
            showToast("🚨 CRIME SCENE: Severe physical breach detected. Access restricted!");
            audio.alert();
          } else {
            setActiveTab(node.type);
            setActiveNodeModal(node);
          }
        }
      };

      // ==========================================
      // CANVAS RENDERING LOOP
      // ==========================================
      useEffect(() => {
        let animationFrameId;
        const render = () => {
          const canvas = canvasRef.current;
          if (canvas && caseData) {
            const ctx = canvas.getContext('2d');
            const now = Date.now();

            // Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Tilemap
            drawWorldTilemap(ctx, canvas.width, canvas.height, now);

            // Draw Interactive Node Icons & Labels
            INTERACTIVE_NODES.forEach(node => {
              const nx = node.tileX * TILE_SIZE;
              const ny = node.tileY * TILE_SIZE;
              ctx.fillStyle = "rgba(88, 166, 255, 0.2)";
              ctx.beginPath();
              ctx.arc(nx + 12, ny + 12, 14, 0, Math.PI * 2);
              ctx.fill();

              ctx.font = "14px 'JetBrains Mono', monospace";
              ctx.fillText(node.icon, nx + 4, ny + 16);
            });

            // Draw Suspect NPCs (Chibi Pixel Characters matching Reference 1)
            caseData.suspects.forEach(s => {
              const sx = s.mapX * TILE_SIZE;
              const sy = s.mapY * TILE_SIZE;
              drawPixelChibiCharacter(ctx, sx, sy, s.spriteTheme, 'down', 0, false);

              // Name Tag
              ctx.font = "bold 8px 'JetBrains Mono', monospace";
              ctx.fillStyle = "#FFFFFF";
              ctx.fillText(s.name.split(" ")[0], sx - 2, sy - 4);
            });

            // Draw Radar Beacon Ping if active
            if (radarBeacon) {
              const rx = radarBeacon.x * TILE_SIZE + 12;
              const ry = radarBeacon.y * TILE_SIZE + 12;
              const pulse = (Math.sin(now / 150) + 1) * 12 + 10;
              ctx.strokeStyle = "#F43F5E";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(rx, ry, pulse, 0, Math.PI * 2);
              ctx.stroke();

              ctx.fillStyle = "#EF4444";
              ctx.font = "bold 9px 'Press Start 2P', monospace";
              ctx.fillText("BEACON DETECTED!", rx - 60, ry - 20);
            }

            // Draw Player Detective (Chibi Pixel Character)
            drawPixelChibiCharacter(
              ctx,
              playerPos.x * TILE_SIZE,
              playerPos.y * TILE_SIZE,
              DETECTIVE_THEME,
              playerPos.facing,
              Math.floor(now / 120),
              playerPos.isWalking
            );

            // Draw Interaction Indicator above Player when near target
            if (interactTarget) {
              const ix = playerPos.x * TILE_SIZE + 12;
              const iy = playerPos.y * TILE_SIZE - 14;
              ctx.fillStyle = "#E3B341";
              ctx.font = "bold 8px 'Press Start 2P', monospace";
              ctx.fillText("!", ix - 3, iy - 2);

              // Floating interaction pill
              ctx.fillStyle = "rgba(13, 17, 23, 0.9)";
              ctx.strokeStyle = "#E3B341";
              ctx.lineWidth = 1;
              const text = interactTarget.label;
              ctx.font = "bold 9px 'JetBrains Mono', monospace";
              const tw = ctx.measureText(text).width;
              ctx.fillRect(ix - tw / 2 - 4, iy - 16, tw + 8, 14);
              ctx.strokeRect(ix - tw / 2 - 4, iy - 16, tw + 8, 14);
              ctx.fillStyle = "#58A6FF";
              ctx.fillText(text, ix - tw / 2, iy - 6);
            }
          }
          animationFrameId = requestAnimationFrame(render);
        };
        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, [caseData, playerPos, interactTarget, radarBeacon]);

      // Canvas click to move
      const handleCanvasClick = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = Math.floor((e.clientX - rect.left) / (rect.width / MAP_WIDTH));
        const clickY = Math.floor((e.clientY - rect.top) / (rect.height / MAP_HEIGHT));

        setPlayerPos(prev => {
          const facing = clickX < prev.x ? 'left' : clickX > prev.x ? 'right' : clickY < prev.y ? 'up' : 'down';
          audio.step();
          return { x: clickX, y: clickY, facing, isWalking: true };
        });
        setTimeout(() => setPlayerPos(prev => ({ ...prev, isWalking: false })), 200);
      };

      // ==========================================
      // GADGET 1: SIGNAL TRACKER (RADAR DROP)
      // ==========================================
      const triggerSignalTracker = (suspect) => {
        if (!spendAP(1, "Signal Tracker")) return;
        audio.scan();
        setRadarBeacon(null);
        setActiveSuspectModal(null);

        showToast(`📡 TRILATERATING RFID SIGNAL FOR ${suspect.name.toUpperCase()}...`);

        setTimeout(() => {
          audio.success();
          // Drop beacon on their ACTUAL room
          const isMatch = suspect.actualRoom === suspect.statedRoom;
          const targetCoords = isMatch ? { x: suspect.mapX, y: suspect.mapY } : { x: RESTRICTED_ROOM.tileX, y: RESTRICTED_ROOM.tileY };
          setRadarBeacon({ x: targetCoords.x, y: targetCoords.y, room: suspect.actualRoom });

          if (!isMatch) {
            showToast(`🚨 SIGNAL TRACKER CONTRADICTION: Located in ${RESTRICTED_ROOM.name}!`);
          } else {
            showToast(`✓ SIGNAL TRACKER: Confirmed in ${suspect.statedRoom}.`);
          }
        }, 1200);
      };

      // ==========================================
      // BOSS MODE VIEW
      // ==========================================
      if (bossMode) {
        return (
          <div className="min-h-screen bg-[#111827] text-slate-300 font-sans p-6 select-text">
            <div className="flex items-center justify-between pb-4 border-b border-slate-700 mb-6">
              <div className="flex items-center gap-3">
                <div className="w-3.5 h-3.5 rounded bg-emerald-500 animate-pulse"></div>
                <span className="font-bold text-white text-base">Grafana Cloud // Enterprise Production Observability</span>
                <span className="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">cluster-us-east-prod-04</span>
              </div>
              <button onClick={() => setBossMode(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded text-xs border border-slate-600">
                [Esc] Return to Debug
              </button>
            </div>
            <div className="bg-slate-900 border border-slate-800 rounded p-4 mb-4">
              <h3 className="text-sm font-semibold mb-2">Ingress Gateway P99 Latency (14.2ms)</h3>
              <div className="h-36 bg-slate-950 rounded flex items-center justify-center text-xs text-slate-500 font-mono">
                [REALTIME LATENCY TELEMETRY PLOT: ALL 64 NODES HEALTHY]
              </div>
            </div>
            <div className="text-center text-xs text-slate-500 mt-4">Press [Escape] to return to terminal</div>
          </div>
        );
      }

      if (!caseData) return <div className="p-8 text-center font-retro text-cyan-400">INITIALIZING 2D WORLD...</div>;

      return (
        <div className={`min-h-screen flex flex-col font-mono ${shakeScreen ? 'shake-effect' : ''}`}>
          <div className="fixed inset-0 scanlines z-40 pointer-events-none opacity-30"></div>

          {/* Toast */}
          {toastMsg && (
            <div className="fixed top-4 right-4 z-50 bg-[#161B22] border-2 border-cyan-400 text-cyan-300 px-4 py-2 rounded shadow-2xl font-mono text-xs flex items-center gap-2 animate-bounce">
              <span>{toastMsg}</span>
            </div>
          )}

          {/* TOP RETRO COMMAND BAR */}
          <header className="bg-[#161B22] border-b-2 border-[#30363D] px-4 py-2 flex items-center justify-between text-xs font-mono sticky top-0 z-30">
            <div className="flex items-center gap-4">
              <span className="text-lg">🕵️</span>
              <span className="font-bold text-white tracking-wider text-sm">THE COLD FILE // 2D DETECTIVE</span>
              <span className="bg-[#0D1117] text-cyan-400 px-2 py-0.5 rounded border border-[#30363D]">
                {caseData.caseId}
              </span>
            </div>

            <div className="flex items-center gap-3">
              {/* Dual View Toggle */}
              <div className="flex border border-[#30363D] rounded overflow-hidden">
                <button
                  onClick={() => { setViewMode('map'); audio.click(); }}
                  className={`px-3 py-1 font-bold text-xs ${viewMode === 'map' ? 'bg-cyan-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}
                >
                  🎮 2D PIXEL MAP
                </button>
                <button
                  onClick={() => { setViewMode('terminal'); audio.click(); }}
                  className={`px-3 py-1 font-bold text-xs ${viewMode === 'terminal' ? 'bg-cyan-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}
                >
                  🖥️ LOG TERMINAL
                </button>
              </div>

              {/* Sound Toggle */}
              <button
                onClick={() => { const next = !soundMuted; setSoundMuted(next); audio.muted = next; }}
                className="px-2 py-1 bg-[#0D1117] border border-[#30363D] rounded text-slate-300 text-xs"
              >
                {soundMuted ? '🔇 MUTE' : '🔊 SFX'}
              </button>

              {/* Boss Key */}
              <button
                onClick={() => setBossMode(true)}
                className="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded border border-slate-600 text-xs"
              >
                [SYS_MODE] (ESC)
              </button>
            </div>
          </header>

          {/* BRIEFING BANNER */}
          <div className="bg-[#0D1117] border-b border-[#30363D] px-4 py-1.5 flex items-center justify-between text-xs">
            <div className="flex items-center gap-2 truncate">
              <span className="text-rose-400 font-bold">[CRIME]:</span>
              <span className="text-white font-semibold truncate">{caseData.crime.title}</span>
              <span className="text-slate-400 hidden md:inline">• CRITICAL WINDOW: {caseData.crime.criticalWindow}</span>
            </div>
            <div className="text-amber-400 font-bold shrink-0">
              AP: {ap}/{maxAp}
            </div>
          </div>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 flex flex-col lg:flex-row p-4 gap-4 max-w-[1700px] w-full mx-auto">
            
            {/* VIEW 1: 2D PIXEL MAP */}
            {viewMode === 'map' ? (
              <div className="flex-1 flex flex-col lg:flex-row gap-4">
                
                {/* 2D Tilemap Canvas */}
                <div className="flex-1 bg-[#0D1117] border-2 border-[#30363D] rounded-lg p-2 flex flex-col items-center justify-center relative shadow-2xl">
                  <div className="w-full flex justify-between items-center text-xs text-slate-400 px-2 py-1 border-b border-[#30363D] mb-2 font-retro text-[9px]">
                    <span>MOVE: [WASD] or [ARROWS] or CLICK MAP</span>
                    <span>ACTION: [E] or [SPACE]</span>
                  </div>

                  <canvas
                    ref={canvasRef}
                    width={MAP_WIDTH * TILE_SIZE}
                    height={MAP_HEIGHT * TILE_SIZE}
                    onClick={handleCanvasClick}
                    className="border-2 border-[#30363D] rounded bg-black cursor-pointer shadow-inner max-w-full h-auto"
                    style={{ maxHeight: '680px' }}
                  />
                </div>

                {/* Right Side Tactical Sidebar */}
                <div className="w-full lg:w-80 flex flex-col gap-3">
                  {/* AP Gauge */}
                  <div className="bg-[#161B22] border-2 border-[#30363D] rounded-lg p-3">
                    <div className="flex justify-between items-center text-xs mb-2">
                      <span className="font-bold text-cyan-400">ACTION POINTS (AP)</span>
                      <span className="text-amber-400 font-bold">🔥 Streak: {career.streak}</span>
                    </div>
                    <div className="grid grid-cols-8 gap-1 mb-2">
                      {Array.from({ length: maxAp }).map((_, i) => (
                        <div
                          key={i}
                          className={`h-3 rounded-sm border ${
                            i < ap ? 'bg-cyan-400 border-cyan-200' : 'bg-black border-[#30363D] opacity-30'
                          }`}
                        />
                      ))}
                    </div>
                  </div>

                  {/* Suspects Quick Roster */}
                  <div className="bg-[#161B22] border-2 border-[#30363D] rounded-lg p-3 flex-1 flex flex-col">
                    <span className="text-xs font-bold text-white mb-2 block">CAMPUS SUSPECTS (4)</span>
                    <div className="space-y-2 flex-1 overflow-y-auto max-h-[380px]">
                      {caseData.suspects.map(s => (
                        <div
                          key={s.id}
                          onClick={() => { setActiveSuspectModal(s); audio.click(); }}
                          className="p-2 bg-[#0D1117] border border-[#30363D] hover:border-cyan-400 rounded cursor-pointer transition flex items-center justify-between"
                        >
                          <div>
                            <div className="font-bold text-white text-xs">{s.name}</div>
                            <div className="text-[10px] text-slate-400">{s.statedRoom}</div>
                          </div>
                          <span className="text-xs font-retro text-cyan-400">[INSPECT]</span>
                        </div>
                      ))}
                    </div>

                    {/* Accusation Trigger */}
                    <button
                      onClick={() => setAccusationModalOpen(true)}
                      className="mt-3 w-full py-2.5 bg-gradient-to-r from-rose-700 to-amber-700 hover:from-rose-600 hover:to-amber-600 text-white font-bold text-xs rounded border border-rose-400 shadow-lg tracking-wider"
                    >
                      ⚖️ LOCK IN ACCUSATION
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              /* VIEW 2: FULL FORENSIC LOG TERMINAL */
              <div className="flex-1 bg-[#161B22] border-2 border-[#30363D] rounded-lg p-4 flex flex-col shadow-2xl">
                <div className="flex items-center gap-2 pb-3 border-b border-[#30363D] mb-3 text-xs font-bold">
                  <button
                    onClick={() => setActiveTab('badge')}
                    className={`px-3 py-1.5 rounded ${activeTab === 'badge' ? 'bg-cyan-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}
                  >
                    💳 BADGE LOGS ({caseData.evidence.badgeLogs.length})
                  </button>
                  <button
                    onClick={() => setActiveTab('chat')}
                    className={`px-3 py-1.5 rounded ${activeTab === 'chat' ? 'bg-amber-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}
                  >
                    💬 CHAT SNIPPETS ({caseData.evidence.chatLogs.length})
                  </button>
                  <button
                    onClick={() => setActiveTab('network')}
                    className={`px-3 py-1.5 rounded ${activeTab === 'network' ? 'bg-emerald-600 text-white' : 'bg-[#0D1117] text-slate-400'}`}
                  >
                    🌐 NETWORK TRACES ({caseData.evidence.networkLogs.length})
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 text-xs">
                  {caseData.evidence[`${activeTab}Logs`].map(item => (
                    <div key={item.id} className="p-3 bg-[#0D1117] border border-[#30363D] rounded">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-cyan-400 font-bold">[{item.timestamp}] {item.holderName || item.sender || item.source}</span>
                        <span className="text-slate-400">{item.location || item.channel || item.protocol}</span>
                      </div>
                      <p className="text-slate-300 text-[11px]">{item.details || item.message}</p>
                      {item.contradiction && (
                        <div className="mt-1 text-rose-400 font-bold text-[10px]">CONTRADICTION: {item.contradiction}</div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* ======================================================== */}
          {/* SUSPECT DOSSIER & INTERROGATION MODAL */}
          {/* ======================================================== */}
          {activeSuspectModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-[#161B22] border-2 border-cyan-400 rounded-lg max-w-lg w-full p-5 font-mono shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b border-[#30363D] mb-3">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-white text-sm">{activeSuspectModal.name}</span>
                    <span className="text-xs text-slate-400">({activeSuspectModal.badgeId})</span>
                  </div>
                  <button onClick={() => setActiveSuspectModal(null)} className="text-slate-400 hover:text-white">[CLOSE]</button>
                </div>

                <div className="space-y-3 text-xs mb-4">
                  <div className="bg-[#0D1117] p-3 rounded border border-[#30363D]">
                    <span className="text-slate-400 block text-[10px]">ROLE & DEPT:</span>
                    <span className="text-cyan-400 font-bold">{activeSuspectModal.role} ({activeSuspectModal.dept})</span>
                  </div>

                  <div className="bg-[#0D1117] p-3 rounded border border-[#30363D]">
                    <span className="text-amber-400 block text-[10px] font-bold">STATED ALIBI:</span>
                    <p className="text-slate-200 mt-1">{activeSuspectModal.statedAlibi}</p>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2 text-xs">
                  <button
                    onClick={() => triggerSignalTracker(activeSuspectModal)}
                    className="p-2.5 bg-cyan-950 hover:bg-cyan-900 border border-cyan-500 text-cyan-300 rounded font-bold"
                  >
                    📡 SIGNAL TRACKER (1 AP)
                  </button>

                  <button
                    onClick={() => {
                      if (!spendAP(1, "Interrogate")) return;
                      const response = activeSuspectModal.isCulprit 
                        ? caseData.crime.alibiSlipDialogue 
                        : "I was in my office reviewing tickets. Check the commit logs!";
                      showToast(`🎙️ "${response}"`);
                      audio.voiceBeep(450);
                    }}
                    className="p-2.5 bg-amber-950 hover:bg-amber-900 border border-amber-500 text-amber-300 rounded font-bold"
                  >
                    🎙️ INTERROGATE (1 AP)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ======================================================== */}
          {/* ACCUSATION SHOWDOWN MODAL */}
          {/* ======================================================== */}
          {accusationModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-[#161B22] border-2 border-rose-500 rounded-lg max-w-lg w-full p-6 font-mono shadow-2xl">
                {verdictData ? (
                  <div>
                    <h2 className="text-lg font-bold text-center mb-2 text-white">
                      {verdictData.isSuccess ? '🏆 GUILTY VERDICT CONFIRMED!' : '❌ WRONGFUL ACCUSATION!'}
                    </h2>
                    <p className="text-xs text-slate-300 mb-4 bg-[#0D1117] p-3 rounded border border-[#30363D]">
                      {verdictData.summary}
                    </p>
                    <button
                      onClick={() => { setAccusationModalOpen(false); startNewCase(); }}
                      className="w-full py-2.5 bg-cyan-600 hover:bg-cyan-500 text-black font-bold rounded"
                    >
                      NEXT CASE ➔
                    </button>
                  </div>
                ) : (
                  <div>
                    <h2 className="text-sm font-bold text-white mb-3">LOCK IN ACCUSATION SHOWDOWN</h2>
                    <div className="space-y-3 mb-4 text-xs">
                      <div>
                        <label className="block text-slate-400 mb-1">SELECT ACCUSED PRIME SUSPECT:</label>
                        <select
                          value={selectedAccusedSuspectId}
                          onChange={(e) => setSelectedAccusedSuspectId(e.target.value)}
                          className="w-full bg-[#0D1117] border border-[#30363D] rounded p-2 text-white"
                        >
                          <option value="">-- Choose suspect --</option>
                          {caseData.suspects.map(s => (
                            <option key={s.id} value={s.id}>{s.name} ({s.role})</option>
                          ))}
                        </select>
                      </div>
                    </div>

                    <div className="flex justify-end gap-2 text-xs">
                      <button onClick={() => setAccusationModalOpen(false)} className="px-3 py-1.5 bg-[#0D1117] text-slate-300 rounded">
                        CANCEL
                      </button>
                      <button
                        onClick={() => {
                          const accused = caseData.suspects.find(s => s.id === selectedAccusedSuspectId);
                          if (!accused) { showToast("Select a suspect!"); return; }
                          if (accused.isCulprit) {
                            audio.success();
                            setVerdictData({
                              isSuccess: true,
                              summary: `Conclusive proof gathered! ${accused.name} was arrested attempting to exfiltrate ${caseData.crime.compromisedAsset}. Motive: ${accused.motive}`
                            });
                            setCareer(prev => ({ ...prev, streak: prev.streak + 1, xp: prev.xp + 500 }));
                          } else {
                            audio.failure();
                            setVerdictData({
                              isSuccess: false,
                              summary: `Wrongful accusation! ${accused.name} had an airtight alibi. The real culprit was ${caseData.culpritName}!`
                            });
                            setCareer(prev => ({ ...prev, streak: 0 }));
                          }
                        }}
                        className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded"
                      >
                        INDICT TARGET ➔
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-[#161B22] border-t border-[#30363D] px-4 py-2 flex items-center justify-between text-[11px] text-slate-400">
            <span>THE COLD FILE // 2D PIXEL EDITION</span>
            <span>PRESS [ESC] FOR STEALTH BOSS MODE</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
