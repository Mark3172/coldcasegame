        return { hasError: true };

      render() {

          return (
            <div className="min-h-screen bg-[#070B10] text-rose-400 font-mono flex flex-col items-center justify-center p-6 text-center">

    // ==========================================
    // 1. SOUND & AMBIENT SYNTH AUDIO ENGINE
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.bgmEnabled = false;
        this.lastStepTime = 0;
        this.bgmTimer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.04) {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      step() {
        const now = Date.now();
        if (now - this.lastStepTime < 180) return;
        this.lastStepTime = now;
        const p = 160 + Math.random() * 40;
        this.playTone(p, 'triangle', 0.035, 0.018);
      }

      interact() { this.playTone(880, 'triangle', 0.07, 0.035); }
      click() { this.playTone(1400, 'triangle', 0.02, 0.025); }

      scan() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.3);
          gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.31);
        } catch (e) {}
      }

      sonar() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1050, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.45);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.46);
        } catch (e) {}
      }

      decrypt() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        for (let i = 0; i < 6; i++) {
          setTimeout(() => {
            this.playTone(600 + Math.random() * 800, 'sawtooth', 0.03, 0.02);
          }, i * 45);
        }
      }

      alert() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [520, 880, 520, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.045, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.08);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.085);
          });
        } catch (e) {}
      }

      success() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.11);
            gain.gain.setValueAtTime(0.05, now + idx * 0.11);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.32);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.11);
            osc.stop(now + idx * 0.11 + 0.34);
          });
        } catch (e) {}
      }

      failure() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [340, 260, 180].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(freq, now + idx * 0.14);
            gain.gain.setValueAtTime(0.05, now + idx * 0.14);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.14 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.14);
            osc.stop(now + idx * 0.14 + 0.22);
          });
        } catch (e) {}
      }

      voiceBeep(pitch = 500) { this.playTone(pitch, 'triangle', 0.04, 0.025); }

      startBGM() {
        if (this.bgmEnabled) return;
        this.init();
        if (!this.ctx) return;
        this.bgmEnabled = true;

        const chordProg = [
          [130.81, 164.81, 196.00], // C minor
          [110.00, 130.81, 164.81], // A minor
          [146.83, 174.61, 220.00], // D minor
          [98.00, 123.47, 146.83]   // G
        ];
        let chordIdx = 0;

        const playNextChord = () => {
          if (!this.bgmEnabled || !this.ctx) return;
          const freqs = chordProg[chordIdx % chordProg.length];
          chordIdx++;
          const now = this.ctx.currentTime;
          const duration = 6.0;

          freqs.forEach((freq) => {
            try {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              const filter = this.ctx.createBiquadFilter();

              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now);

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(450, now);
              filter.frequency.exponentialRampToValueAtTime(650, now + duration / 2);
              filter.frequency.exponentialRampToValueAtTime(400, now + duration);

              gain.gain.setValueAtTime(0.0001, now);
              gain.gain.linearRampToValueAtTime(0.012, now + 1.2);
              gain.gain.linearRampToValueAtTime(0.0001, now + duration - 0.2);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(this.ctx.destination);

              osc.start(now);
              osc.stop(now + duration);
            } catch (e) {}
          });

          this.bgmTimer = setTimeout(playNextChord, (duration - 0.8) * 1000);
        };

        playNextChord();
      }

      stopBGM() {
        this.bgmEnabled = false;
        if (this.bgmTimer) clearTimeout(this.bgmTimer);
      }
    }

    function drawPixelChibiCharacter(ctx, x, y, theme, facing = 'down', walkProgress = 0, isWalking = false, isBlinking = false) {

    const MAP_WIDTH = 32;

    const INTERACTIVE_NODES = [

    // Solid collision matrix
    function isSolidTile(x, y) {
      if (x <= 0 || y <= 0 || x >= MAP_WIDTH - 1 || y >= MAP_HEIGHT - 1) return true;

      // Partition walls with 3-tile wide doorways
      // Left vertical wall: x = 13 (doorway at y: 7, 8, 9)
      if (x === 13) {
        if (y < 7 || (y > 9 && y < 14) || y > 17) return true;
      }
      // Right vertical wall: x = 18 (doorway at y: 7, 8, 9)
      if (x === 18) {
        if (y < 7 || (y > 9 && y < 14) || y > 17) return true;
      }
      // Horizontal upper wall: y = 10 (doorway at x: 14, 15, 16, 17)
      if (y === 10) {
        if (x < 14 || x > 17) return true;
      }
      // Horizontal lower wall: y = 13 (doorway at x: 14, 15, 16, 17)
      if (y === 13) {
        if (x < 14 || x > 17) return true;
      }

      // Conference Table: x: 22..26, y: 4..6
      if (x >= 22 && x <= 26 && y >= 4 && y <= 6) return true;

      // Server Racks in Vault: x: 3..10, y: 3
      if (x >= 3 && x <= 10 && y === 3) return true;

      return false;
    }

    function checkCollision(px, py, width, height) {
      const minX = Math.floor(px / TILE_SIZE);
      const maxX = Math.floor((px + width - 1) / TILE_SIZE);
      const minY = Math.floor(py / TILE_SIZE);
      const maxY = Math.floor((py + height - 1) / TILE_SIZE);

      for (let tx = minX; tx <= maxX; tx++) {
        for (let ty = minY; ty <= maxY; ty++) {
          if (isSolidTile(tx, ty)) return true;
        }
      }
      return false;
    }

    let cachedMapCanvas = null;

    function buildStaticMapBuffer() {
      const buffer = document.createElement('canvas');
      buffer.width = MAP_WIDTH * TILE_SIZE;
      buffer.height = MAP_HEIGHT * TILE_SIZE;
      const ctx = buffer.getContext('2d');

      // 1. Cozy Floors (Warm wood parquet, soft cafeteria tiles, velvet rugs)
      for (let y = 0; y < MAP_HEIGHT; y++) {
        for (let x = 0; x < MAP_WIDTH; x++) {
          const px = x * TILE_SIZE;
          const py = y * TILE_SIZE;

          // Outer Wall Border
          if (x === 0 || y === 0 || x === MAP_WIDTH - 1 || y === MAP_HEIGHT - 1) {
            ctx.fillStyle = "#121A24";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#1C2938";
            ctx.fillRect(px + 1, py + 1, TILE_SIZE - 2, 3);
            continue;
          }

          if (x < 13 && y < 10) {
            // Server Vault (Cool Navy Slate with metal seams)
            ctx.fillStyle = (x + y) % 2 === 0 ? "#111823" : "#16202C";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#1A2634";
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
          } else if (x > 18 && y < 10) {
            // Conference Room 4A (Sprout Lands Warm Honey Wood Planks)
            ctx.fillStyle = (x + y) % 2 === 0 ? "#9A6635" : "#88582A";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.fillStyle = "#6F441E";
            ctx.fillRect(px, py + TILE_SIZE - 2, TILE_SIZE, 2); // Wood plank groove
          } else if (x < 13 && y > 13) {
            // Cafeteria (Cozy Cream-Beige Tiles)
            ctx.fillStyle = (x + y) % 2 === 0 ? "#EBE0CF" : "#DDD1BD";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#C5B8A5";
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
          } else if (x > 18 && y > 13) {
            // Executive Lounge (Rich Burgundy Velvet Rug with Gold Trim)
            ctx.fillStyle = (x + y) % 2 === 0 ? "#591B2A" : "#692033";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            if (x === 19 || x === MAP_WIDTH - 2 || y === 14 || y === MAP_HEIGHT - 2) {
              ctx.fillStyle = "#EAB308";
              ctx.fillRect(px, py, TILE_SIZE, 2); // Gold fringe border
            }
          } else {
            // Central Security Hallway (Warm Linoleum with soft grid)
            ctx.fillStyle = (x + y) % 2 === 0 ? "#1E2A38" : "#243243";
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = "#192330";
            ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
          }
        }
      }

      // 2. Interior Walls (Sprout Lands style with depth and wood capping)
      const drawWall = (wx, wy, ww, wh) => {
        ctx.fillStyle = "#18222D";
        ctx.fillRect(wx, wy, ww, wh);
        ctx.fillStyle = "#2D3E52";
        ctx.fillRect(wx, wy, ww, 3); // Highlight
        ctx.fillStyle = "#0F161E";
        ctx.fillRect(wx, wy + wh - 3, ww, 3); // Shadow
      };

      // Draw walls respecting open doorways
      drawWall(13 * TILE_SIZE, 1 * TILE_SIZE, 8, 6 * TILE_SIZE);
      drawWall(13 * TILE_SIZE, 10 * TILE_SIZE, 8, 3 * TILE_SIZE);
      drawWall(13 * TILE_SIZE, 18 * TILE_SIZE, 8, 5 * TILE_SIZE);

      drawWall(18 * TILE_SIZE, 1 * TILE_SIZE, 8, 6 * TILE_SIZE);
      drawWall(18 * TILE_SIZE, 10 * TILE_SIZE, 8, 3 * TILE_SIZE);
      drawWall(18 * TILE_SIZE, 18 * TILE_SIZE, 8, 5 * TILE_SIZE);

      drawWall(1 * TILE_SIZE, 10 * TILE_SIZE, 12 * TILE_SIZE, 8);
      drawWall(19 * TILE_SIZE, 10 * TILE_SIZE, 12 * TILE_SIZE, 8);
      drawWall(1 * TILE_SIZE, 13 * TILE_SIZE, 12 * TILE_SIZE, 8);
      drawWall(19 * TILE_SIZE, 13 * TILE_SIZE, 12 * TILE_SIZE, 8);

      // 3. Furniture (Sprout Lands Detailing)
      // A) Conference Mahogany Table with soft shadow
      ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
      ctx.fillRect(22 * TILE_SIZE + 4, 4 * TILE_SIZE + 4, 5 * TILE_SIZE, 3 * TILE_SIZE);
      ctx.fillStyle = "#582C13";
      ctx.fillRect(22 * TILE_SIZE, 4 * TILE_SIZE, 5 * TILE_SIZE, 3 * TILE_SIZE);
      ctx.fillStyle = "#723B1B";
      ctx.fillRect(22 * TILE_SIZE + 2, 4 * TILE_SIZE + 2, 5 * TILE_SIZE - 4, 3 * TILE_SIZE - 4);

      // Laptops & Mugs on table
      ctx.fillStyle = "#94A3B8";
      ctx.fillRect(23 * TILE_SIZE, 5 * TILE_SIZE, 12, 10);
      ctx.fillRect(25 * TILE_SIZE, 5 * TILE_SIZE, 12, 10);
      ctx.fillStyle = "#FFFFFF"; // Coffee mug
      ctx.fillRect(24 * TILE_SIZE + 2, 5 * TILE_SIZE + 2, 5, 5);

      // B) Server Racks (Navy Metal Racks in Sublevel 2)
      for (let r = 0; r < 4; r++) {
        const rx = (3 + r * 2) * TILE_SIZE;
        const ry = 3 * TILE_SIZE;
        ctx.fillStyle = "#090E14";
        ctx.fillRect(rx, ry, 36, 48);
        ctx.strokeStyle = "#1E2C3D";
        ctx.strokeRect(rx, ry, 36, 48);
      }

      // C) Potted Plants (Cute Sprout Lands Bushes)
      const drawPlant = (px, py) => {
        ctx.fillStyle = "#B45309"; // Terracotta pot
        ctx.fillRect(px + 4, py + 10, 16, 14);
        ctx.fillStyle = "#16A34A"; // Green bush
        ctx.beginPath();
        ctx.arc(px + 12, py + 8, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#4ADE80"; // Highlight leaf
        ctx.beginPath();
        ctx.arc(px + 9, py + 6, 4, 0, Math.PI * 2);
        ctx.fill();
      };
      drawPlant(19 * TILE_SIZE, 14 * TILE_SIZE);
      drawPlant(29 * TILE_SIZE, 14 * TILE_SIZE);
      drawPlant(19 * TILE_SIZE, 21 * TILE_SIZE);
      drawPlant(29 * TILE_SIZE, 21 * TILE_SIZE);

      // D) Soft Room Sign Headers
      ctx.font = "bold 8px 'Press Start 2P', monospace";
      ctx.fillStyle = "#F87171";
      ctx.fillText("SERVER VAULT (RESTRICTED)", 2 * TILE_SIZE, 2.2 * TILE_SIZE);
      ctx.fillStyle = "#38BDF8";
      ctx.fillText("CONFERENCE ROOM 4A", 20 * TILE_SIZE, 2.2 * TILE_SIZE);
      ctx.fillStyle = "#34D399";
      ctx.fillText("BREAKROOM & CAFETERIA", 2 * TILE_SIZE, 14.8 * TILE_SIZE);
      ctx.fillStyle = "#F472B6";
      ctx.fillText("EXECUTIVE LOUNGE", 20 * TILE_SIZE, 14.8 * TILE_SIZE);

      return buffer;
    }

            reward: "Deep Scan verified the incident occurred during the critical window.",
            actionType: "HINT_TIME"
          },
          {
            title: "ENCRYPTED DRIVE CRACKED",
            desc: "SecOps automated brute-force cracked an abandoned flash drive from the breakroom.",
            reward: "Cleared 1 innocent suspect from suspicion completely!",
            actionType: "CLEAR_SUSPECT"
          }
        ];
        const evt = events[Math.floor(Math.random() * events.length)];
        audio.alert();
        setShakeScreen(true);
        setTimeout(() => setShakeScreen(false), 400);
        setLiveLeakModal(evt);
      };

      // Keyboard Controls
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setBossMode(prev => !prev);
            return;
          }
          if (activeSuspectModal || activeNodeModal || accusationModalOpen || liveLeakModal) return;

          const key = e.key.toLowerCase();
          if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
            e.preventDefault();
            keysPressedRef.current.add(key);
            playerRef.current.targetX = null;
            playerRef.current.targetY = null;
            targetCursorRef.current = null;
          } else if (key === 'e' || e.key === ' ') {
            triggerNearbyInteraction();
          }
        };

        const handleKeyUp = (e) => {
          const key = e.key.toLowerCase();
          keysPressedRef.current.delete(key);
        };

        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, [activeSuspectModal, activeNodeModal, accusationModalOpen, liveLeakModal, interactTarget]);

      const triggerNearbyInteraction = () => {
        if (!interactTarget) return;
        audio.interact();
        if (interactTarget.type === 'suspect') {
          setActiveSuspectModal(interactTarget.data);
          setInterrogationDialogue(null);
        } else if (interactTarget.type === 'node') {
          const node = interactTarget.data;
          if (node.type === 'crime_scene') {
            showToast("🚨 BREACHED SAFE: Physical seal was broken with an authorized biometric override!");
            audio.alert();
          } else {
            setActiveTab(node.type);
            setActiveNodeModal(node);
          }
        }
      };

      // Draw Dialogue Portrait when suspect modal opens
      useEffect(() => {
        if (activeSuspectModal && portraitCanvasRef.current) {
          const ctx = portraitCanvasRef.current.getContext('2d');
          drawChibiDialoguePortrait(ctx, activeSuspectModal.spriteTheme, activeSuspectModal.stressLevel);
        }
      }, [activeSuspectModal]);

      // ==========================================
      // 60FPS SILKY SMOOTH KINEMATICS & RENDER LOOP
      // ==========================================
      useEffect(() => {
        if (!cachedMapCanvas) {
          cachedMapCanvas = buildStaticMapBuffer();
        }

        let animId;
        let lastTime = performance.now();

        const gameLoop = (currentTime) => {
          const dt = Math.min(0.04, (currentTime - lastTime) / 1000);
          lastTime = currentTime;

          try {
            const canvas = canvasRef.current;
            const p = playerRef.current;
            const keys = keysPressedRef.current;

            // 1. SMOOTH VECTOR ACCELERATION & DIRECTIONAL BLEND
            let inputX = 0, inputY = 0;
            if (keys.has('w') || keys.has('arrowup')) inputY -= 1;
            if (keys.has('s') || keys.has('arrowdown')) inputY += 1;
            if (keys.has('a') || keys.has('arrowleft')) inputX -= 1;
            if (keys.has('d') || keys.has('arrowright')) inputX += 1;

            const accel = 1600; // Responsive acceleration
            const friction = 0.81; // Viscous damping
            const maxSpeed = 145; // Fluid walking speed

            if (inputX !== 0 || inputY !== 0) {
              const len = Math.hypot(inputX, inputY);
              p.vx += (inputX / len) * accel * dt;
              p.vy += (inputY / len) * accel * dt;

              // Smooth Facing Orientation
              if (Math.abs(inputX) > Math.abs(inputY)) {
                p.facing = inputX < 0 ? 'left' : 'right';
              } else {
                p.facing = inputY < 0 ? 'up' : 'down';
              }
              p.isWalking = true;
              audio.step();
            } else if (p.targetX !== null && p.targetY !== null) {
              // Click-to-move glide
              const dx = p.targetX - p.x;
              const dy = p.targetY - p.y;
              const dist = Math.hypot(dx, dy);

              if (dist > 4) {
                p.vx += (dx / dist) * accel * dt;
                p.vy += (dy / dist) * accel * dt;
                p.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
                p.isWalking = true;
                audio.step();
              } else {
                p.targetX = null;
                p.targetY = null;
                targetCursorRef.current = null;
              }
            }

            // Apply friction
            p.vx *= friction;
            p.vy *= friction;

            // Clamp max speed
            const currentSpeed = Math.hypot(p.vx, p.vy);
            if (currentSpeed > maxSpeed) {
              p.vx = (p.vx / currentSpeed) * maxSpeed;
              p.vy = (p.vy / currentSpeed) * maxSpeed;
            }

            // 2. SILKY WALL-SLIDING COLLISION (Independent X and Y axes)
            const footW = 14;
            const footH = 10;
            const footOffY = 18;

            const nextX = p.x + p.vx * dt;
            if (!checkCollision(nextX + 5, p.y + footOffY, footW, footH)) {
              p.x = nextX;
            } else {
              p.vx = 0; // Wall slide absorption
            }

            const nextY = p.y + p.vy * dt;
            if (!checkCollision(p.x + 5, nextY + footOffY, footW, footH)) {
              p.y = nextY;
            } else {
              p.vy = 0; // Wall slide absorption
            }

            // Stride Cycle & Dust Particles
            if (currentSpeed > 8) {
              p.isWalking = true;
              p.walkProgress += dt * 9.5;

              if (Math.random() < 0.28) {
                dustParticlesRef.current.push({
                  x: p.x + 12 + (Math.random() * 4 - 2),
                  y: p.y + 26,
                  vx: (Math.random() - 0.5) * 8,
                  vy: -Math.random() * 6 - 2,
                  life: 1.0
                });
              }
            } else {
              p.isWalking = false;
            }

            // Update dust particles
            dustParticlesRef.current = dustParticlesRef.current.filter(part => {
              part.x += part.vx * dt;
              part.y += part.vy * dt;
              part.life -= dt * 2.8;
              return part.life > 0;
            });

            // 3. PROXIMITY CHECK (Only updates React on actual target ID transition)
            if (caseData && caseData.suspects) {
              const playerTileX = p.x / TILE_SIZE;
              const playerTileY = p.y / TILE_SIZE;
              let found = null;
              let foundId = null;

              for (const s of caseData.suspects) {
                const dist = Math.hypot(s.mapX - playerTileX, s.mapY - playerTileY);
                if (dist <= 2.2) {
                  found = { type: 'suspect', data: s, label: `[E] QUESTION ${s.name.toUpperCase()}` };
                  foundId = s.id;
                  break;
                }
              }

              if (!found) {
                for (const node of INTERACTIVE_NODES) {
                  const dist = Math.hypot(node.tileX - playerTileX, node.tileY - playerTileY);
                  if (dist <= 2.2) {
                    found = { type: 'node', data: node, label: node.label };
                    foundId = node.id;
                    break;
                  }
                }
              }

              if (foundId !== currentTargetIdRef.current) {
                currentTargetIdRef.current = foundId;
                setInteractTarget(found);
              }
            }

            // 4. CANVAS RENDER PASS
            if (canvas && caseData) {
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height);

              // 4A. Draw Pre-rendered Background Map
              if (cachedMapCanvas) {
                ctx.drawImage(cachedMapCanvas, 0, 0);
              }

              // 4B. Dynamic Animated Overlays
              // Blinking server LEDs
              for (let r = 0; r < 4; r++) {
                const rx = (3 + r * 2) * TILE_SIZE;
                const ry = 3 * TILE_SIZE;
                const b1 = Math.floor(currentTime / 180 + r) % 2 === 0;
                ctx.fillStyle = b1 ? "#10B981" : "#064E3B";
                ctx.fillRect(rx + 6, ry + 10, 4, 4);
                ctx.fillStyle = "#F43F5E";
                ctx.fillRect(rx + 14, ry + 10, 4, 4);
                ctx.fillStyle = "#38BDF8";
                ctx.fillRect(rx + 22, ry + 10, 4, 4);
              }

              // Coffee Mug Steam in Conference Room
              const steamY = 5 * TILE_SIZE - ((currentTime / 40) % 12);
              ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
              ctx.fillRect(24 * TILE_SIZE + 3, steamY, 2, 3);

              // Animated Breached Safe Hazard Glow
              const pulseSafe = Math.sin(currentTime / 280) * 0.25 + 0.35;
              ctx.fillStyle = `rgba(244, 63, 94, ${pulseSafe})`;
              ctx.fillRect(6 * TILE_SIZE - 4, 4 * TILE_SIZE - 4, 32, 32);

              // Click-to-move Ripple Cursor
              if (targetCursorRef.current) {
                const tc = targetCursorRef.current;
                const age = (currentTime - tc.spawnTime) / 1000;
                const ringSize = (age * 18) % 20 + 4;
                ctx.strokeStyle = "rgba(56, 189, 248, 0.85)";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(tc.x + 12, tc.y + 12, ringSize, 0, Math.PI * 2);
                ctx.stroke();
              }

              // Dust Particles
              dustParticlesRef.current.forEach(part => {
                ctx.fillStyle = `rgba(203, 213, 225, ${part.life * 0.45})`;
                ctx.fillRect(Math.floor(part.x), Math.floor(part.y), 3, 3);
              });

              // Interactive Terminals (Glowing holographic blips)
              INTERACTIVE_NODES.forEach(node => {
                const nx = node.tileX * TILE_SIZE;
                const ny = node.tileY * TILE_SIZE;
                const pulse = Math.sin(currentTime / 280) * 3 + 12;

                ctx.fillStyle = "rgba(56, 189, 248, 0.25)";
                ctx.beginPath();
                ctx.arc(nx + 12, ny + 12, pulse, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = "14px monospace";
                ctx.fillText(node.icon, nx + 4, ny + 16);
              });

              // Suspect NPCs (Alive with micro-actions and gentle breathing)
              const blinkNow = Math.floor(currentTime / 3200) % 2 === 0 && (currentTime % 3200 < 180);

              if (caseData.suspects) {
                caseData.suspects.forEach((s, idx) => {
                  const sx = (s.mapX !== undefined ? s.mapX : 10) * TILE_SIZE;
                  const sy = (s.mapY !== undefined ? s.mapY : 10) * TILE_SIZE;
                  const theme = s.spriteTheme || SPRITE_THEMES[idx % SPRITE_THEMES.length];

                  drawPixelChibiCharacter(ctx, sx, sy, theme, 'down', 0, false, blinkNow);

                  // Overhead Name Tag & Status
                  ctx.fillStyle = "rgba(15, 23, 34, 0.85)";
                  ctx.fillRect(sx - 8, sy - 8, 40, 10);
                  ctx.strokeStyle = "#38BDF8";
                  ctx.lineWidth = 1;
                  ctx.strokeRect(sx - 8, sy - 8, 40, 10);

                  ctx.font = "bold 8px monospace";
                  ctx.fillStyle = "#E2E8F0";
                  ctx.fillText(s.name.split(" ")[0], sx - 4, sy);
                });
              }

              // Radar Beacon & Sonar Sweep (From Signal Tracker Gadget!)
              if (radarBeacon) {
                const rx = radarBeacon.x * TILE_SIZE + 12;
                const ry = radarBeacon.y * TILE_SIZE + 12;
                const pulse = (Math.sin(currentTime / 180) + 1) * 16 + 10;

                ctx.strokeStyle = "#F43F5E";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(rx, ry, pulse, 0, Math.PI * 2);
                ctx.stroke();

                // Rotating radar sweep line
                const angle = (currentTime / 500) % (Math.PI * 2);
                ctx.strokeStyle = "rgba(244, 63, 94, 0.6)";
                ctx.beginPath();
                ctx.moveTo(rx, ry);
                ctx.lineTo(rx + Math.cos(angle) * 36, ry + Math.sin(angle) * 36);
                ctx.stroke();

                ctx.fillStyle = "#F43F5E";
                ctx.font = "bold 8px 'Press Start 2P', monospace";
                ctx.fillText("BEACON DETECTED", rx - 48, ry - 24);
              }

              // Detective Player Character (Silky animated Reference 1 chibi)
              drawPixelChibiCharacter(
                ctx,
                p.x,
                p.y,
                DETECTIVE_THEME,
                p.facing,
                p.walkProgress,
                p.isWalking,
                blinkNow
              );

              // Floating Interactive Indicator with gentle springy bob
              if (interactTarget) {
                const ix = p.x + 12;
                const bob = Math.sin(currentTime / 220) * 3;
                const iy = p.y - 14 + bob;

                ctx.fillStyle = "rgba(7, 11, 16, 0.94)";
                ctx.strokeStyle = "#38BDF8";
                ctx.lineWidth = 1.5;
                const text = interactTarget.label;
                ctx.font = "bold 9px monospace";
                const tw = ctx.measureText(text).width;
                ctx.fillRect(ix - tw / 2 - 6, iy - 16, tw + 12, 16);
                ctx.strokeRect(ix - tw / 2 - 6, iy - 16, tw + 12, 16);
                ctx.fillStyle = "#38BDF8";
                ctx.fillText(text, ix - tw / 2, iy - 5);
              }
            }
          } catch (err) {
            console.error("Game loop error:", err);
          }

          animId = requestAnimationFrame(gameLoop);
        };

        animId = requestAnimationFrame(gameLoop);
        return () => cancelAnimationFrame(animId);
      }, [caseData, radarBeacon, interactTarget]);

      // Click to move target
      const handleCanvasClick = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const clickX = ((e.clientX - rect.left) / rect.width) * (MAP_WIDTH * TILE_SIZE);
        const clickY = ((e.clientY - rect.top) / rect.height) * (MAP_HEIGHT * TILE_SIZE);

        playerRef.current.targetX = clickX - 12;
        playerRef.current.targetY = clickY - 14;

        targetCursorRef.current = {
          x: clickX - 12,
          y: clickY - 14,
          spawnTime: performance.now()
        };
        audio.click();
      };

      if (bossMode) {
        return (

              <span className="font-bold text-white text-base">Grafana Cloud // Ingress Cluster Latency (p99: 14.2ms)</span>
              <button onClick={() => setBossMode(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded text-xs">
                [Esc] Return
              </button>
            </div>
            <div className="grid grid-cols-3 gap-4 mb-6">

                <div className="text-xs text-slate-400">Total Ingress Throughput</div>
                <div className="text-2xl font-bold text-emerald-400 mt-1">2.84 GB/s</div>

                <div className="text-2xl font-bold text-cyan-400 mt-1">64 / 64 Healthy</div>

                <div className="text-2xl font-bold text-indigo-400 mt-1">0.02% / 24h</div>
              </div>
            </div>
            <div className="h-64 bg-slate-950 rounded flex items-center justify-center text-xs text-slate-500 font-mono border border-slate-800">
              [SYSTEM API LATENCY & SERVER HEALTH TELEMETRY NORMAL]
            </div>
          </div>
        );
      }

      return (
        <div className={`min-h-screen flex flex-col font-mono ${shakeScreen ? 'shake-effect' : ''}`}>
          <div className="fixed inset-0 scanlines z-40 pointer-events-none opacity-25"></div>

          {toastMsg && (
            <div className="fixed top-4 right-4 z-50 cyber-card border-2 border-cyan-400 text-cyan-300 px-4 py-2.5 rounded shadow-2xl text-xs flex items-center gap-2">
              <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
              <span className="font-bold">{toastMsg}</span>
            </div>
          )}

          {/* TOP HIGH-TECH CYBER HEADER */}
          <header className="bg-[#0F1722] border-b-2 border-[#223449] px-4 py-2.5 flex items-center justify-between text-xs sticky top-0 z-30 shadow-xl">
            <div className="flex items-center gap-3">
              <span className="text-2xl">🕵️</span>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-bold text-white text-sm tracking-wider font-pixel">THE COLD FILE</span>
                  <span className="text-[10px] bg-cyan-950 text-cyan-300 border border-cyan-700 px-1.5 py-0.5 rounded font-mono">
                    2D INVESTIGATOR
                  </span>
                </div>
                <div className="text-[10px] text-slate-400 font-mono">
                  CASE: <strong className="text-cyan-400">{caseData.caseId}</strong> | RANK: <span className="text-amber-400">{career.rankTitle}</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2.5">
              {/* View Toggle */}
              <div className="flex border border-[#223449] rounded overflow-hidden">
                <button
                  onClick={() => { setViewMode('map'); audio.click(); }}
                  className={`px-3 py-1.5 font-bold text-xs transition ${viewMode === 'map' ? 'bg-cyan-600 text-white shadow-lg' : 'bg-[#070B10] text-slate-400'}`}
                >
                  🎮 2D MAP
                </button>
                <button
                  onClick={() => { setViewMode('terminal'); audio.click(); }}
                  className={`px-3 py-1.5 font-bold text-xs transition ${viewMode === 'terminal' ? 'bg-cyan-600 text-white shadow-lg' : 'bg-[#070B10] text-slate-400'}`}
                >
                  🖥️ LOGS
                </button>
              </div>

              {/* BGM Toggle */}
              <button
                onClick={toggleBGM}
                className={`px-3 py-1.5 cyber-btn text-xs font-bold ${
                  bgmActive ? 'text-emerald-400 border-emerald-500' : 'text-slate-400'
                }`}
              >
                {bgmActive ? '🎵 BGM: ON' : '🎵 BGM: OFF'}
              </button>

              {/* Sound Toggle */}
              <button
                onClick={() => { const next = !soundMuted; setSoundMuted(next); audio.muted = next; }}

              </button>

          {/* CRITICAL INCIDENT BRIEFING BAR */}
          <div className="bg-[#0A0F15] border-b border-[#223449] px-4 py-2 flex items-center justify-between text-xs">
            <div className="flex items-center gap-2 truncate">
              <span className="text-rose-400 font-bold shrink-0">[BREACH]: {caseData.crime.title}</span>
              <span className="text-slate-400 hidden md:inline truncate">{caseData.crime.summary}</span>
            </div>
            <div className="text-amber-400 font-bold shrink-0 flex items-center gap-3">
              <span>CRITICAL WINDOW: {caseData.crime.criticalWindow}</span>
              <span className="bg-[#152130] px-2.5 py-1 rounded border border-amber-500/50 text-amber-300 shadow-md">
                COMPUTE AP: {ap}/{maxAp}
              </span>

          {/* MAIN GAMEPLAY VIEW */}
          <main className="flex-1 flex flex-col lg:flex-row p-3 gap-3 max-w-[1740px] w-full mx-auto">
            {viewMode === 'map' ? (
              <div className="flex-1 flex flex-col lg:flex-row gap-3">

                <div className="flex-1 cyber-card p-3 flex flex-col items-center justify-center relative shadow-2xl overflow-hidden">
                  <div className="w-full flex justify-between items-center text-xs text-slate-400 px-2 py-1.5 border-b border-[#223449] mb-2 font-pixel text-[9px]">
                    <span className="text-cyan-400">HOLD [WASD] OR CLICK ANYWHERE TO GLIDE</span>
                    <span className="text-amber-400">INTERACT: [E] OR [SPACE]</span>
                  </div>

                  <canvas
                    ref={canvasRef}

                    style={{ maxHeight: '680px' }}

                {/* Cyber Sidebar: Suspects & Gadget Dock */}

                  <div className="cyber-card p-3.5">

                      <span className="font-bold text-cyan-400 font-pixel text-[10px]">COMPUTE AP</span>
                      <span className="text-amber-400 font-bold">🔥 Streak: {career.streak}</span>
                    </div>
                    <div className="grid grid-cols-8 gap-1.5 mb-2">
                      {Array.from({ length: maxAp }).map((_, i) => (
                        <div
                          key={i}
                          className={`h-4 rounded border transition-all duration-300 ${
                            i < ap
                              ? 'bg-cyan-400 border-cyan-200 shadow-[0_0_10px_rgba(56,189,248,0.9)]'
                              : 'bg-black border-[#223449] opacity-20'
                          }`}
                        />
                      ))}
                    </div>
                  </div>

                  {/* Detective Gadgets Dock */}
                  <div className="cyber-card p-3.5">
                    <div className="text-xs font-bold text-white mb-2 font-pixel text-[10px] text-cyan-400">
                      TACTICAL GADGETS DOCK
                    </div>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      <button

                        className="p-2.5 cyber-btn text-cyan-300 font-bold flex flex-col items-center justify-center gap-1"

                        className="p-2.5 cyber-btn text-emerald-300 font-bold flex flex-col items-center justify-center gap-1"

                  <div className="cyber-card p-3.5 flex-1 flex flex-col">
                    <div className="flex justify-between items-center mb-2.5">
                      <span className="text-xs font-bold text-white tracking-wider font-pixel text-[10px]">CAMPUS SUSPECTS (4)</span>
                      <span className="text-[10px] text-slate-400">CLICK TO TARGET</span>
                    </div>

                    <div className="space-y-2 flex-1 overflow-y-auto max-h-[300px]">
                      {caseData.suspects.map(s => (
                        <div
                          key={s.id}
                          onClick={() => { setActiveSuspectModal(s); audio.click(); }}
                          className="p-2.5 bg-[#0A0F15] border border-[#223449] hover:border-cyan-400 rounded-lg cursor-pointer transition flex items-center justify-between group"
                        >
                          <div>
                            <div className="font-bold text-white text-xs group-hover:text-cyan-300 transition">{s.name}</div>
                            <div className="text-[10px] text-slate-400">{s.statedRoom}</div>
                          </div>
                          <span className="text-xs font-pixel text-[9px] text-cyan-400 group-hover:scale-105 transition">[INTERROGATE]</span>
                        </div>
                      ))}
                    </div>

                    <button
                      onClick={() => setAccusationModalOpen(true)}
                      className="mt-3.5 w-full py-3.5 bg-gradient-to-r from-rose-700 via-red-600 to-amber-700 hover:from-rose-600 hover:to-amber-600 text-white font-bold text-xs rounded-lg border border-rose-400 shadow-[0_0_20px_rgba(244,63,94,0.4)] tracking-wider font-pixel text-[10px]"
                    >
                      ⚖️ LOCK IN ACCUSATION
                    </button>
                  </div>
                </div>
              </div>
            ) : (
              <div className="flex-1 cyber-card p-4 flex flex-col shadow-2xl">
                <div className="flex items-center gap-2 pb-3 border-b border-[#223449] mb-3 text-xs font-bold">
                  <button onClick={() => setActiveTab('badge')} className={`px-3 py-1.5 rounded ${activeTab === 'badge' ? 'bg-cyan-600 text-white shadow-lg' : 'bg-[#0A0F15] text-slate-400'}`}>
                    💳 KEYCARDS ({caseData.evidence.badgeLogs.length})
                  </button>
                  <button onClick={() => setActiveTab('chat')} className={`px-3 py-1.5 rounded ${activeTab === 'chat' ? 'bg-amber-600 text-white shadow-lg' : 'bg-[#0A0F15] text-slate-400'}`}>
                    💬 CHATS ({caseData.evidence.chatLogs.length})
                  </button>
                  <button onClick={() => setActiveTab('network')} className={`px-3 py-1.5 rounded ${activeTab === 'network' ? 'bg-emerald-600 text-white shadow-lg' : 'bg-[#0A0F15] text-slate-400'}`}>
                    🌐 NETWORK ({caseData.evidence.networkLogs.length})
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-2.5 text-xs">
                  {caseData.evidence[`${activeTab}Logs`].map(item => (
                    <div key={item.id} className="p-3 bg-[#0A0F15] border border-[#223449] rounded-lg">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-cyan-400 font-bold">[{item.timestamp}] {item.holderName || item.sender || item.source}</span>
                        <span className="text-slate-400 text-[10px]">{item.location || item.channel || item.protocol}</span>
                      </div>
                      <p className="text-slate-200 text-xs leading-relaxed">{item.details || item.message}</p>
                      {item.contradiction && (
                        <div className="mt-2 text-rose-400 font-bold text-[11px] bg-rose-950/40 p-2 rounded border border-rose-800">
                          CONTRADICTION DETECTED: {item.contradiction}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* SPROUT LANDS CHIBI DIALOGUE BUST MODAL (REFERENCE 1) */}
          {activeSuspectModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="cyber-card border-2 border-cyan-400 rounded-xl max-w-xl w-full p-5 shadow-2xl">
                <div className="flex justify-between items-center pb-2.5 border-b border-[#223449] mb-4">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-white text-base font-pixel text-xs">{activeSuspectModal.name}</span>
                    <span className="text-xs text-slate-400">({activeSuspectModal.badgeId})</span>
                  </div>
                  <button onClick={() => setActiveSuspectModal(null)} className="text-slate-400 hover:text-white text-xs font-bold">[CLOSE ✕]</button>
                </div>

                {/* Handcrafted Chibi Anime Bust Portrait */}
                <div className="flex gap-4 mb-4">
                  <div className="w-24 h-28 bg-[#070B10] border-2 border-cyan-500 rounded-lg flex items-center justify-center shrink-0 shadow-lg overflow-hidden">
                    <canvas ref={portraitCanvasRef} width={96} height={120} className="w-full h-full" />
                  </div>

                  <div className="flex-1 space-y-2 text-xs">
                    <div className="bg-[#0A0F15] p-2.5 rounded border border-[#223449]">
                      <span className="text-slate-400 block text-[10px]">ROLE & CLEARANCE:</span>
                      <span className="text-cyan-400 font-bold">{activeSuspectModal.role} ({activeSuspectModal.accessLevel})</span>
                    </div>

                    <div className="bg-[#0A0F15] p-2.5 rounded border border-[#223449]">
                      <span className="text-amber-400 block text-[10px] font-bold">STATED ALIBI:</span>
                      <p className="text-slate-200 mt-0.5 text-xs leading-relaxed">{activeSuspectModal.statedAlibi}</p>
                    </div>

                    {/* Suspect Stress Meter */}
                    <div className="bg-[#0A0F15] p-2 rounded border border-[#223449]">
                      <div className="flex justify-between text-[10px] mb-1">
                        <span className="text-slate-400">PSYCHOLOGICAL STRESS:</span>
                        <span className={`font-bold ${activeSuspectModal.stressLevel > 60 ? 'text-rose-400' : 'text-emerald-400'}`}>
                          {activeSuspectModal.stressLevel}%
                        </span>
                      </div>
                      <div className="h-2 bg-black rounded-full overflow-hidden">
                        <div
                          className={`h-full transition-all duration-300 ${activeSuspectModal.stressLevel > 60 ? 'bg-rose-500 shadow-[0_0_8px_#F43F5E]' : 'bg-emerald-500'}`}
                          style={{ width: `${activeSuspectModal.stressLevel}%` }}
                        />
                      </div>
                    </div>
                  </div>
                </div>

                {interrogationDialogue && (
                  <div className="bg-[#0A0F15] p-3 rounded-lg border border-amber-500/40 text-amber-200 text-xs mb-4 leading-relaxed">
                    <strong>SUSPECT RESPONSE:</strong> "{interrogationDialogue}"
                  </div>
                )}

                {/* Interrogation Actions */}
                <div className="grid grid-cols-2 gap-3 text-xs">
                  <button
                    onClick={() => {
                      if (!spendAP(1, "TRACKER")) return;
                      audio.scan();
                      setActiveSuspectModal(null);
                      const isMatch = activeSuspectModal.actualRoom === activeSuspectModal.statedRoom;
                      const target = isMatch ? { x: activeSuspectModal.mapX, y: activeSuspectModal.mapY } : { x: RESTRICTED_ROOM.tileX, y: RESTRICTED_ROOM.tileY };
                      setRadarBeacon(target);
                      showToast(isMatch ? `✓ RFID Confirmed in ${activeSuspectModal.statedRoom}` : `🚨 RFID Detected inside ${RESTRICTED_ROOM.name}!`);
                    }}
                    className="p-3 cyber-btn text-cyan-300 font-bold"
                  >
                    📡 SIGNAL TRACKER (1 AP)
                  </button>

                  <button
                    onClick={() => {
                      if (!spendAP(1, "INTERROGATE")) return;
                      const newStress = Math.min(100, activeSuspectModal.stressLevel + 25);
                      activeSuspectModal.stressLevel = newStress;

                      let reply = "";
                      if (activeSuspectModal.isCulprit) {
                        reply = newStress > 60 ? caseData.crime.alibiSlipDialogue : "I already told you my alibi. What reason would I have to breach the core vault?";
                      } else {
                        reply = "Check my git commits or cafeteria logs! I was nowhere near the vault during the incident.";
                      }
                      setInterrogationDialogue(reply);
                      audio.voiceBeep(480);

                      // Redraw with new stress
                      if (portraitCanvasRef.current) {
                        const ctx = portraitCanvasRef.current.getContext('2d');
                        drawChibiDialoguePortrait(ctx, activeSuspectModal.spriteTheme, newStress);
                      }
                    }}
                    className="p-3 cyber-btn text-amber-300 font-bold"
                  >
                    🎙️ PRESS ON ALIBI (1 AP)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SURPRISE LIVE LEAK POPUP MODAL */}
          {liveLeakModal && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="cyber-card border-2 border-rose-500 rounded-xl max-w-md w-full p-6 shadow-2xl">
                <div className="flex items-center gap-2 mb-3 text-rose-400 font-pixel text-xs">
                  <span className="text-xl">🚨</span>
                  <span>SURPRISE INTERCEPT ALERT</span>
                </div>
                <h3 className="text-white font-bold text-sm mb-2">{liveLeakModal.title}</h3>
                <p className="text-slate-300 text-xs mb-3 leading-relaxed">{liveLeakModal.desc}</p>
                <div className="bg-[#0A0F15] p-3 rounded border border-rose-500/50 text-rose-300 text-xs font-bold mb-4">
                  {liveLeakModal.reward}
                </div>
                <button
                  onClick={() => setLiveLeakModal(null)}
                  className="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-xs"
                >
                  DISMISS & RESUME INVESTIGATION
                </button>
              </div>
            </div>
          )}

          {/* ACCUSATION SHOWDOWN MODAL */}
          {accusationModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="cyber-card border-2 border-rose-500 rounded-xl max-w-lg w-full p-6 shadow-2xl">
                {verdictData ? (
                  <div>
                    <h2 className="text-base font-bold text-center mb-3 text-white font-pixel">
                      {verdictData.isSuccess ? '🏆 GUILTY VERDICT CONFIRMED!' : '❌ WRONGFUL ACCUSATION!'}
                    </h2>
                    <p className="text-xs text-slate-300 mb-4 bg-[#0A0F15] p-3.5 rounded-lg border border-[#223449] leading-relaxed">
                      {verdictData.summary}
                    </p>
                    <button
                      onClick={() => {
                        setAccusationModalOpen(false);
                        setVerdictData(null);
                        setCaseData(generateCaseData(caseData.caseNumber + 1));
                        setAp(8);
                      }}
                      className="w-full py-3 bg-cyan-600 hover:bg-cyan-500 text-black font-bold rounded-lg text-xs font-pixel"
                    >
                      PROCEED TO NEXT CASE ➔
                    </button>
                  </div>
                ) : (
                  <div>
                    <h2 className="text-xs font-bold text-white mb-3 font-pixel">LOCK IN ACCUSATION SHOWDOWN</h2>
                    <p className="text-[11px] text-slate-400 mb-3">
                      Select the primary culprit to indict. Contradictions cross-reference automatically against logged biometric and network evidence.
                    </p>

                    <label className="text-[10px] text-slate-400 block mb-1">SELECT SUSPECT TO INDICT:</label>
                    <select
                      value={selectedAccusedSuspectId}
                      onChange={(e) => setSelectedAccusedSuspectId(e.target.value)}
                      className="w-full bg-[#0A0F15] border border-[#223449] rounded-lg p-2.5 text-white text-xs mb-4"
                    >
                      <option value="">-- Choose suspect to indict --</option>
                      {caseData.suspects.map(s => (
                        <option key={s.id} value={s.id}>{s.name} ({s.role})</option>
                      ))}
                    </select>

                    <div className="flex justify-end gap-2 text-xs">
                      <button onClick={() => setAccusationModalOpen(false)} className="px-4 py-2 cyber-btn text-slate-300">
                        CANCEL
                      </button>
                      <button
                        onClick={() => {
                          const accused = caseData.suspects.find(s => s.id === selectedAccusedSuspectId);
                          if (!accused) return;
                          if (accused.isCulprit) {
                            audio.success();
                            setVerdictData({
                              isSuccess: true,
                              summary: `Case solved! ${accused.name} was taken into custody after their RFID swipe into ${RESTRICTED_ROOM.name} shattered their alibi. Motive: ${accused.motive}`
                            });
                            setCareer(prev => ({
                              ...prev,
                              streak: prev.streak + 1,
                              xp: prev.xp + 250,
                              rankTitle: "Chief SecOps Investigator"
                            }));
                          } else {
                            audio.failure();
                            setVerdictData({
                              isSuccess: false,
                              summary: `Wrongful accusation! ${accused.name} was fully innocent. The real culprit was ${caseData.culpritName}!`
                            });
                            setCareer(prev => ({ ...prev, streak: 0 }));
                          }
                        }}
                        className="px-5 py-2 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg"
                      >
                        INDICT TARGET ➔
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          <footer className="bg-[#0F1722] border-t border-[#223449] px-4 py-2 flex items-center justify-between text-[11px] text-slate-400">
            <span>THE COLD FILE // SPROUT LANDS x CYBER-NOIR EDITION</span>
            <span>PRESS [ESC] FOR STEALTH BOSS MODE</span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
